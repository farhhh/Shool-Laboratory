<script>
(()=>{
const $=s=>document.querySelector(s),cv=$('#scene'),ctx=cv.getContext('2d'),cl=(v,a,b)=>v<a?a:v>b?b:v;
const SUP='⁰¹²³⁴⁵⁶⁷⁸⁹',SUB='₀₁₂₃₄₅₆₇₈₉',sp=n=>String(n).replace(/\d/g,d=>SUP[d]),sb=n=>String(n).replace(/\d/g,d=>SUB[d]),f2=x=>x.toFixed(2).replace('.',',');

/* стабильные изотопы (массовые числа); первым идёт самый распространённый */
const ST=[],BYA={};
'1:1,2|2:4,3|3:7,6|4:9|5:11,10|6:12,13|7:14,15|8:16,18,17|9:19|10:20,22,21|11:23|12:24,26,25|13:27|14:28,29,30|15:31|16:32,34,33,36|17:35,37|18:40,36,38|19:39,41|20:40,44,42,48,43,46|21:45|22:48,46,47,49,50|23:51|24:52,53,50,54|25:55|26:56,54,57,58|27:59|28:58,60,62,61,64|29:63,65|30:64,66,68,67,70|31:69,71|32:74,72,70,73,76|33:75|34:80,78,76,82,77,74|35:79,81|36:84,86,82,83,80,78|37:85|38:88,86,87,84|39:89|40:90,94,92,91,96|41:93|42:98,96,95,92,100,97,94|44:102,104,101,99,100,96,98|45:103|46:106,108,105,110,104,102|47:107,109|48:114,112,111,110,108,106|49:113|50:120,118,116,119,117,124,122,112,114,115|51:121,123|52:130,128,126,125,124,123,122,120|53:127|54:132,129,131,134,136,130,128,126,124|55:133|56:138,137,136,135,134,132,130|57:139|58:140,142,138,136|59:141|60:142,144,146,143,145,148,150|62:152,154,147,149,148,150,144|63:153,151|64:158,160,156,157,155,154,152|65:159|66:164,162,163,161,160,158,156|67:165|68:166,168,167,170,164,162|69:169|70:174,172,173,171,176,170,168|71:175|72:180,178,177,179,176,174|73:181|74:184,186,182,183,180|75:185|76:192,190,189,188,187,186,184|77:193,191|78:195,194,196,198,192,190|79:197|80:202,200,199,201,198,204,196|81:205,203|82:208,206,207,204|83:209'.split('|').forEach(s=>{const[z,a]=s.split(':');ST[+z]=a.split(',').map(Number);ST[+z].forEach(A=>(BYA[A]=BYA[A]||[]).push(+z))});
Object.values(BYA).forEach(a=>a.sort((x,y)=>x-y));
const zline=A=>A/(1.98+.0155*Math.pow(A,2/3)); // линия бета-стабильности (приближённо)
const nmax=Z=>Z<1?0:Z<=12?[0,2,6,8,12,14,16,16,16,22,24,28,28][Z]:Z<=20?28+1.5*(Z-12):40+2.3*(Z-20); // предел: больше нейтронов ядро не удержит
const nmin=Z=>Z<7?[0,0,1,3,3,3,3][Z]:Z<=20?Math.round(.7*Z):14+1.15*(Z-20); // меньше нейтронов: протоны разлетятся
const OV={'2,5':'n','2,7':'n','3,5':'p','4,8':'a','19,40':'b-','43,98':'b-','92,238':'a','90,234':'b-','91,234':'b-','92,234':'a','90,230':'a','88,226':'a','86,222':'a','84,218':'a','82,214':'b-','83,214':'b-','84,214':'a','82,210':'b-','83,210':'b-','84,210':'a'}; // исключения + цепочка урана-238
const isStable=(Z,N)=>!!(ST[Z]&&ST[Z].includes(Z+N));
function mode(Z,N){ // null — стабильно; 'free' — свободные нейтроны
 if(Z<1)return N>0?'free':null;if(isStable(Z,N))return null;const A=Z+N,o=OV[Z+','+A];if(o)return o;
 if(N>nmax(Z))return'n';if(N<nmin(Z))return'p';
 if(Z>=84)return Z-zline(A)<-.8?'b-':'a';
 const zs=BYA[A];if(zs){const lo=zs[0],hi=zs[zs.length-1];if(Z<lo)return'b-';if(Z>hi)return'b+'}
 return Z-zline(A)<0?'b-':'b+'}
const step=(Z,N,m)=>m==='n'?[Z,N-1]:m==='p'?[Z-1,N]:m==='b-'?[Z+1,N-1]:m==='b+'?[Z-1,N+1]:[Z-2,N-2];
function chain(Z,N){const r=[];let m;while(r.length<80&&(m=mode(Z,N))&&m!=='free'){const[z,n]=step(Z,N,m);if(z<0||n<0)break;r.push({m,Z,N});Z=z;N=n}return{r,Z,N}}
const nl=(z,n)=>z<1?sp(n)+'₀n':sp(z+n)+sb(z)+EL[z-1].s,nm=(z,n)=>z<1?(n?'Нейтроны':'—'):EL[z-1].n+'-'+(z+n),chs=q=>q?(Math.abs(q)>1?sp(Math.abs(q)):'')+(q>0?'⁺':'⁻'):'';
const EQR={n:' + ¹₀n','p':' + ¹₁p⁺','b-':' + e⁻ + ν̄','b+':' + e⁺ + ν',a:' + ⁴₂He'},eq=(m,z,n)=>nl(z,n)+' → '+nl(...step(z,n,m))+EQR[m];
const MT={n:['Нейтронов слишком много — ядро выбрасывает лишние.','Нейтронов больше предела связи: ядерные силы их не удерживают, и они вылетают почти мгновенно.'],p:['Протоны отталкиваются, а нейтронов не хватает — ядро выбрасывает протоны.','Мало нейтронов: электрическое отталкивание протонов сильнее ядерного притяжения, протоны вылетают.'],'b-':['Нейтронов многовато. Один нейтрон превратится в протон, вылетит электрон (β⁻-распад).','Избыток нейтронов: n → p + e⁻ + ν̄. Z растёт на 1, A не меняется — получается другой элемент.'],'b+':['Нейтронов маловато. Протон превратится в нейтрон, вылетит позитрон (β⁺-распад).','Недостаток нейтронов: p → n + e⁺ + ν. Z уменьшается на 1, A не меняется.'],a:['Ядро выбрасывает α-частицу — ядро гелия-4 (2 протона + 2 нейтрона).','α-распад: Z − 2, N − 2 (A − 4). Так распадаются тяжёлые ядра, например уран-238.']};
const DL={n:.4,p:.4,'b-':1.4,'b+':1.4,a:1.9};
/* оболочки: [слой, подуровень, ёмкость] в порядке заполнения */
const SH=[[1,0,2],[2,0,2],[2,1,6],[3,0,2],[3,1,6],[4,0,2],[3,2,10],[4,1,6],[5,0,2],[4,2,10],[5,1,6],[6,0,2],[4,3,14],[5,2,10],[6,1,6],[7,0,2],[5,3,14],[6,2,10],[7,1,6]];

const FS={nu:[],ns:[],fr:[],fx:[],fis:0,en:0,bt:[],tt:[],hist:[],t:0,hA:0,fc:0,eN:85,mod:85,rod:0,n:120,r:12,boom:false,src:false,sa:0,tx:[]},FAST=260,SLOW=110;
function seedS(){const b=xbox(),w=b.x1-b.x0,h=b.y1-b.y0,M=FS.n,cols=Math.ceil(Math.sqrt(M*w/h)),rows=Math.ceil(M/cols),cw=w/cols,ch=h/rows;FS.r=cl(Math.sqrt(w*h/M)/4,5,12);FS.nu=[];
 for(let i=0;i<M;i++)FS.nu.push({x:b.x0+(i%cols+.5+rnd(-.3,.3))*cw,y:b.y0+((i/cols|0)+.5+rnd(-.3,.3))*ch,q:Math.random(),d:0,cap:0});
 Object.assign(FS,{ns:[],fr:[],fx:[],tx:[],fis:0,en:0,bt:[],tt:[],hist:[],t:0,hA:0,fc:0,boom:false})}
function shoot(){const b=xbox(),a=rnd(-.5,.5);FS.ns.push({x:b.x0+2,y:rnd(b.y0+20,b.y1-20),vx:Math.cos(a)*FAST,vy:Math.sin(a)*FAST,f:1,cd:0})}
function inRod(n,b){const h=FS.rod/100*(b.y1-b.y0);if(!h||n.y>b.y0+h)return false;for(let i=0;i<7;i++)if(Math.abs(n.x-(b.x0+(i+.5)*(b.x1-b.x0)/7))<6)return true;return false}
function split(u){u.d=1;const k=Math.random()<.43?3:2,a=u.fa;FS.fr.push({x:u.x,y:u.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,l:2.4,c:'#ffb86b'},{x:u.x,y:u.y,vx:-Math.cos(a)*170,vy:-Math.sin(a)*170,l:2.4,c:'#8edcff'});
 for(let j=0;j<k;j++){const b=rnd(0,6.283);FS.ns.push({x:u.x,y:u.y,vx:Math.cos(b)*FAST,vy:Math.sin(b)*FAST,f:1,cd:FS.t+.12});FS.bt.push(FS.t)}
 FS.tx.push({x:u.x,y:u.y,l:1.2,s:'+'+k+' n'});FS.fx.push({x:u.x,y:u.y,l:.7});FS.fis++;FS.fc++;FS.en+=200}
function sUpd(dt){const b=xbox(),ns=FS.ns,r2=FS.r*FS.r;FS.t+=dt;if(FS.src&&(FS.sa+=dt)>1.2){FS.sa=0;shoot()}ring(FS.fx,dt);for(const u of FS.nu)if(u.d===2&&(u.fl-=dt)<=0)split(u);
 for(const f of FS.fr){const dr=Math.pow(.35,dt);f.vx*=dr;f.vy*=dr;f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}FS.fr=FS.fr.filter(f=>f.l>0);for(const t of FS.tx){t.y-=22*dt;t.l-=dt}FS.tx=FS.tx.filter(t=>t.l>0);
 for(let i=ns.length-1;i>=0;i--){const n=ns[i];let gone=false;
  if(n.f&&Math.random()<FS.mod/100*3.5*dt){n.f=0;const a=Math.atan2(n.vy,n.vx);n.vx=Math.cos(a)*SLOW;n.vy=Math.sin(a)*SLOW}
  n.x+=n.vx*dt;n.y+=n.vy*dt;
  if(n.x<b.x0||n.x>b.x1||n.y<b.y0||n.y>b.y1||inRod(n,b))gone=true;
  else if(n.cd<=FS.t)for(const u of FS.nu){if(u.d)continue;const dx=u.x-n.x,dy=u.y-n.y;if(dx*dx+dy*dy>=r2)continue;
   if(u.q<FS.eN/100){if(Math.random()<(n.f?.04:.9)){u.d=2;u.fl=.4;u.fa=Math.atan2(n.vy,n.vx)+1.57;gone=true;FS.fx.push({x:u.x,y:u.y,l:.7});break}}
   else if(Math.random()<(n.f?.1:.03)){u.cap=1;gone=true;break}
   const a=rnd(0,6.283),sp0=n.f?FAST:SLOW;n.vx=Math.cos(a)*sp0;n.vy=Math.sin(a)*sp0;n.x=u.x+Math.cos(a)*(FS.r+2);n.y=u.y+Math.sin(a)*(FS.r+2);n.cd=FS.t+.1;break}
  if(gone){FS.tt.push(FS.t);ns.splice(i,1)}}
 if(ns.length>260){ns.splice(0,ns.length-260);if(!FS.boom){FS.boom=true;toast('Лавина нейтронов! Опускайте стержни — иначе реактор «разгонится».')}}
 while(FS.bt.length&&FS.bt[0]<FS.t-3)FS.bt.shift();while(FS.tt.length&&FS.tt[0]<FS.t-3)FS.tt.shift();
 FS.hA+=dt;if(FS.hA>=.25){FS.hA=0;FS.hist.push(FS.fc);FS.fc=0;if(FS.hist.length>100)FS.hist.shift()}}
function sDraw(){const b=xbox(),w=b.x1-b.x0,h=b.y1-b.y0;clr();ctx.fillStyle=`rgba(120,200,255,${FS.mod/100*.16})`;ctx.fillRect(b.x0,b.y0,w,h);ctx.strokeStyle='rgba(208,188,255,.4)';ctx.lineWidth=2;ctx.strokeRect(b.x0,b.y0,w,h);
 const r=FS.r,s=r*2.2;for(const u of FS.nu){if(u.d===1){const c=Math.cos(u.fa),sn=Math.sin(u.fa),o=r*.7;ctx.globalAlpha=.55;ctx.fillStyle='#ffb86b';ctx.beginPath();ctx.arc(u.x+c*o,u.y+sn*o,r*.38,0,6.2832);ctx.fill();ctx.fillStyle='#8edcff';ctx.beginPath();ctx.arc(u.x-c*o,u.y-sn*o,r*.38,0,6.2832);ctx.fill();ctx.globalAlpha=1;continue}
  if(u.d===2){const p=1-u.fl/.4,o=r*.9*p,c=Math.cos(u.fa),sn=Math.sin(u.fa),w=1+.25*Math.sin(p*25);ctx.drawImage(SU,u.x+c*o-s*w/2,u.y+sn*o-s*w/2,s*w,s*w);ctx.drawImage(SU,u.x-c*o-s*w/2,u.y-sn*o-s*w/2,s*w,s*w);ctx.fillStyle=`rgba(255,255,255,${.5*(1-p)+.2})`;ctx.beginPath();ctx.arc(u.x,u.y,r*(1.1+p),0,6.2832);ctx.fill();continue}ctx.drawImage(u.q<FS.eN/100?SU:S8,u.x-s/2,u.y-s/2,s,s);if(u.cap){ctx.strokeStyle='#ffe29a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(u.x,u.y,r+2,0,6.2832);ctx.stroke()}}
 for(const f of FS.fr){ctx.globalAlpha=Math.min(1,f.l);ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,r*.85,0,6.2832);ctx.fill()}ctx.globalAlpha=1;
 ctx.lineWidth=3;for(const n of FS.ns){ctx.strokeStyle=n.f?'rgba(255,170,110,.55)':'rgba(150,255,190,.55)';ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(n.x-n.vx*.09,n.y-n.vy*.09);ctx.stroke();ctx.drawImage(n.f?SF:SS,n.x-20,n.y-20,40,40)}
 drawRings(FS.fx,'#ffb86b');ctx.font='700 14px "Roboto Flex"';ctx.fillStyle='#ffe29a';ctx.textAlign='center';for(const t of FS.tx){ctx.globalAlpha=Math.min(1,t.l);ctx.fillText(t.s,t.x,t.y-r-4)}ctx.globalAlpha=1;
 const rh=FS.rod/100*h;if(rh){ctx.fillStyle='#3a3548';ctx.strokeStyle='#8a8298';ctx.lineWidth=1;for(let i=0;i<7;i++){const x=b.x0+(i+.5)*w/7-6;ctx.fillRect(x,b.y0,12,rh);ctx.strokeRect(x,b.y0,12,rh)}}
 const gx=b.x1-230,gy=b.y0+8,mx=Math.max(5,...FS.hist);ctx.fillStyle='rgba(11,9,18,.95)';ctx.fillRect(gx,gy,222,64);ctx.fillStyle='rgba(203,195,212,.8)';ctx.font='500 10px "Roboto Flex"';ctx.textAlign='left';ctx.fillText('Мощность: делений за 0,25 с',gx+6,gy+12);
 ctx.strokeStyle='#ffb86b';ctx.lineWidth=2;ctx.beginPath();FS.hist.forEach((v,i)=>{const x=gx+6+i*2.1,y=gy+60-v/mx*40;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function sStats(){const al=FS.nu.reduce((a,u)=>a+(!u.d&&u.q<FS.eN/100?1:0),0),k=FS.tt.length>=6?FS.bt.length/FS.tt.length:null;let c='',t;
 if(!FS.ns.length&&!al&&FS.fis){c='warn';t='Топливо (U-235) выгорело, реакция закончилась.'}
 else if(!FS.ns.length){t=FS.fis?'Нейтроны закончились — реакция затухла. Выстрелите снова.':'Нейтронов нет. Нажмите «Выстрел» — один нейтрон запустит цепочку.'}
 else if(k===null)t='Реакция только началась — подождите пару секунд.';
 else if(k<.9){c='warn';t='Реакция затухает: нейтронов теряется больше, чем рождается (k < 1).'}else if(k<=1.1){c='ok';t='Стабильная цепная реакция (k ≈ 1) — так работает ядерный реактор.'}else{c='no';t='Разгон (k > 1): число делений растёт лавиной. В реакторе так нельзя — нужны стержни!'}
 let h=`<div class="verdict ${c}">${t}</div><span class="fm">²³⁵₉₂U + n → ¹⁴¹₅₆Ba + ⁹²₃₆Kr + 3n + ≈ 200 МэВ<small>одна из многих возможных пар осколков; рождается 2–3 новых нейтрона</small></span><span class="fm">Делений: ${FS.fis} · нейтронов в поле: ${FS.ns.length}<small>k = ${k===null?'—':f1(k).replace(',0','')+(k<=1.1&&k>=.9?'':'')}${k!==null?' (сколько новых нейтронов рождается на каждый исчезнувший)':''}</small></span>`;
 if(detail)h+=`<span class="fm">Энергия: ${f1(FS.en)} МэВ ≈ ${sci(FS.en*1.602e-13)} Дж<small>одно деление ≈ 200 МэВ ≈ 3,2·10⁻¹¹ Дж. Полное деление 1 кг U-235 даёт ≈ 8·10¹³ Дж — примерно в три миллиона раз больше, чем сгорание 1 кг угля (≈ 3·10⁷ Дж).</small></span><span class="fm">Зачем замедлитель?<small>Быстрые нейтроны почти не делят U-235, а медленные (тепловые) — очень охотно. Поэтому в реакторах есть вода или графит.</small></span><span class="fm">Роль U-238<small>Его ядра в основном рассеивают нейтроны и лишь изредка поглощают. Природный уран — это 0,7% U-235; в реакторах обычно 3–5%. Наша 2D-модель сильно упрощена, поэтому «ровная работа» получается при большем обогащении.</small></span>`;
 return h+lgd([['#ffd27a','U-235 (делится)'],['#a79dc4','U-238'],['#ffb07a','быстрый нейтрон'],['#9be3a8','медленный нейтрон'],['#3a3548','стержни',1],['#ffb86b','осколки деления']])}
/* ---------- переключение режимов ---------- */
const FP=[['Цепная реакция',85,85,0,0,120],['Природный уран (≈ 1%)',1,60,0,0,100],['Реактор: ровная работа',42,70,25,1,100],['Стержни опущены: заглушка',42,70,100,1,100]];
const xvals=()=>{const set=(k,v,t)=>{const i=document.querySelector('[data-s="'+k+'"]'),l=$('#xv_'+k);if(i)i.value=v;if(l)l.textContent=t};
 if(mode0==='fus'){set('tau',FZ.tau,FZ.tau+' млн К');set('n',FZ.n,FZ.n)}else{set('e',FS.eN,FS.eN+'%');set('m',FS.mod,FS.mod+'%');set('r',FS.rod,FS.rod+'%');set('n',FS.n,FS.n)}};
function xBuild(){const lv='<button class="tg" data-x="level">Режим: '+(detail?'подробно':'кратко')+'</button>',ps='<button class="tg" data-x="pause">'+(paused?'▶ Пуск':'⏸ Пауза')+'</button>',sg='<div class="seg">'+[.25,.5,1].map(v=>`<button data-xs="${v}"${v===xs?' class="on"':''}>${String(v).replace('.',',')}×</button>`).join('')+'</div>';
 if(mode0==='fus'){$('#xp').innerHTML=sl('tau','Температура','#ff9d8a',5,500,FZ.tau,'нагрей плазму: ядра полетят быстрее')+sl('n','Частиц топлива','#8edcff',8,60,FZ.n,'меняет количество частиц и перезапускает опыт')+'<div id="xst"></div>';
  $('#xdock').innerHTML='<button class="tg primary" data-x="fuel">＋ Топливо</button><button class="tg" data-x="reset">↺ Заново</button>'+ps+sg+lv;$('#nav').innerHTML=RX.map((r,i)=>`<button class="chip" data-i="${i}">${r.n}</button>`).join('');$('#readout').textContent='☀ Синтез'}
 else{$('#xp').innerHTML=sl('e','Обогащение U-235','#ffd27a',1,100,FS.eN,'доля делящихся ядер среди всех')+sl('m','Замедлитель','#8edcff',0,100,FS.mod,'замедляет нейтроны — они лучше делят уран')+sl('r','Стержни-поглотители','#aab4cf',0,100,FS.rod,'глубже — больше нейтронов поглощается')+sl('n','Количество ядер','#ffb86b',30,140,FS.n,'плотнее — меньше нейтронов вылетает наружу')+'<div id="xst"></div>';
  $('#xdock').innerHTML='<button class="tg primary" data-x="shot">⚛ Выстрел</button><button class="tg" data-x="burst">Залп ×5</button><button class="tg" data-x="reset">↺ Заново</button><button class="tg'+(FS.src?' on':'')+'" data-x="src">Источник: '+(FS.src?'вкл':'выкл')+'</button>'+ps+sg+lv;$('#nav').innerHTML=FP.map((r,i)=>`<button class="chip" data-i="${i}">${r[0]}</button>`).join('');$('#readout').textContent='☢ Деление'}
 xvals();xT=0}
const xInit=()=>mode0==='fus'?seedF():seedS(),xStep=dt=>mode0==='fus'?fUpd(dt):sUpd(dt),xDraw=()=>mode0==='fus'?fDraw():sDraw();
let xc='';function xStats(){const h=mode0==='fus'?fStats():sStats();if(h!==xc){const e=$('#xst');if(e){e.innerHTML=h;xc=h}}}
function setMode(m){if(m===mode0)return;mode0=m;xc='';document.body.dataset.mode=m;document.body.classList.remove('panel-open');$('#menu').classList.remove('on');for(const t of document.querySelectorAll('.tab'))t.classList.toggle('on',t.dataset.m===m);
 if(m==='atom'){$('#nav').innerHTML=PRE.map((p,i)=>`<button class="chip" data-i="${i}">${p[0]}</button>`).join('');layout();uiDirty=true;dirty=60;return}
 layout();xBuild();xInit();if(m==='fis')for(let i=0;i<5;i++)shoot()}
function xnav(i){if(mode0==='fus'){FZ.rx=i;seedF()}else{const p=FP[i];FS.eN=p[1];FS.mod=p[2];FS.rod=p[3];FS.src=!!p[4];FS.n=p[5];xBuild();seedS();if(!p[4]&&p[1]>50)for(let k=0;k<5;k++)shoot()}xc='';xT=0}
function xset(k,v){if(mode0==='fus'){if(k==='tau'){const r=Math.sqrt(v/FZ.tau);for(const p of FZ.ps)if(!esc(p.k)){p.vx*=r;p.vy*=r}FZ.tau=v}else{FZ.n=v;seedF()}}
 else{if(k==='e')FS.eN=v;else if(k==='m')FS.mod=v;else if(k==='r')FS.rod=v;else{FS.n=v;seedS()}}xvals();xT=0}
$('#xp').oninput=e=>{const t=e.target;if(t.dataset.s)xset(t.dataset.s,+t.value)};
$('#xdock').onclick=e=>{const q=e.target.closest('[data-xs]');if(q){xs=+q.dataset.xs;for(const x of q.parentNode.children)x.classList.toggle('on',x===q);return}const b=e.target.closest('[data-x]');if(!b)return;const k=b.dataset.x;
 if(k==='pause'){paused=!paused;b.textContent=paused?'▶ Пуск':'⏸ Пауза';b.classList.toggle('on',paused)}
 else if(k==='level'){$('#level').click();b.textContent='Режим: '+(detail?'подробно':'кратко');xc='';xT=0}
 else if(mode0==='fus'){if(k==='reset')seedF();else{const R=RX[FZ.rx],bx=xbox();for(let i=0;i<6;i++)FZ.ps.push(newF(R.a,bx),newF(R.b,bx));FZ.out=false}xT=0}
 else{if(k==='src'){FS.src=!FS.src;b.textContent='Источник: '+(FS.src?'вкл':'выкл');b.classList.toggle('on',FS.src)}else if(k==='reset')seedS();else{for(let i=0;i<(k==='burst'?5:1);i++)shoot()}xT=0}};
for(const t of document.querySelectorAll('.tab'))t.onclick=()=>setMode(t.dataset.m);
resize();setAll(6,6,6);requestAnimationFrame(loop);
})();
