<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Оптическая лаборатория — физика света</title>
<style>@font-face{font-family:"Roboto Flex";font-style:normal;font-weight:400 900;font-display:swap;src:url("../../fonts/roboto-flex.woff") format("woff")}</style><style>
:root{color-scheme:dark;--bg:#0b0912;--s1:#1d1a24;--s2:#272330;--s3:#322d3d;--on:#e8e0ee;--on2:#cbc3d4;--ol:#4b4556;--pr:#d0bcff;--onpr:#381e72;--acc:#d0bcff;--ok:#9be3a8;--er:#ffb4ab;box-sizing:border-box}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--on);font:400 14px/1.45 "Roboto Flex",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}button,input,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.glass{background:rgba(29,26,36,.94);border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:9px 12px 9px 18px;border-radius:28px;z-index:5}
#top h1{font:900 19px/1 "Roboto Flex";letter-spacing:-.4px;flex:1;white-space:nowrap;background:linear-gradient(90deg,#ffe29a,#ffb0c8,var(--pr));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{padding:8px 13px;border-radius:16px;background:var(--s2);font-weight:500;white-space:nowrap}.pill small{color:var(--on2);font-weight:400}
#nav{position:fixed;left:12px;right:12px;top:70px;display:flex;gap:8px;overflow-x:auto;padding:2px;z-index:4;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 10px;border-radius:10px;border:1px solid var(--ol);background:rgba(29,26,36,.7);white-space:nowrap;font-weight:500}.chip i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 8px currentColor}.chip.on{background:var(--acc);color:#14101c;border-color:transparent}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:30px;z-index:5;max-width:calc(100% - 16px);flex-wrap:wrap;justify-content:center}
.tg{height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--ol);font-weight:500}.tg.on{background:#4a4458;color:#eaddff;border-color:transparent}.tg.primary{background:var(--pr);color:#27154d;border-color:transparent;font-weight:700}
#panel{position:fixed;z-index:6;background:var(--s1);border-radius:28px;overflow:auto;right:12px;top:116px;bottom:12px;width:360px;transform:translateX(120%);padding:20px;transition:transform .45s cubic-bezier(.2,0,0,1);box-shadow:0 20px 60px #000a}
body.panel-open #panel{transform:none}#panel:before{content:"";position:absolute;inset:0 0 auto;height:180px;background:radial-gradient(circle at 20% 0,var(--acc),transparent 70%);opacity:.2;pointer-events:none}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;background:var(--s2);z-index:2}
.hero{display:flex;gap:14px;align-items:center;position:relative;padding-right:35px}.orb{width:66px;height:66px;flex:none;border-radius:50%;box-shadow:0 0 34px var(--acc),inset -14px -10px 22px #000a;background:radial-gradient(circle at 32% 30%,#fff9,var(--acc) 38%,#000 130%)}
.kind{color:var(--acc);font-weight:700}h2{font:900 30px/1.05 "Roboto Flex";letter-spacing:-.8px}
.fact{margin:17px 0;padding:13px 15px;border-radius:20px 20px 20px 6px;background:var(--s2);color:var(--on2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{padding:11px 13px;border-radius:15px;background:var(--s2)}.tile small{display:block;color:var(--on2);font-size:12px}.tile b{font-weight:500;font-size:14px}
.section{margin-top:18px;position:relative}.section h3{font-size:15px;margin-bottom:9px}.field{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:11px 0;color:var(--on2)}.field b{color:var(--on);font-weight:500}.field input[type=range]{width:52%;accent-color:var(--pr)}.rangebox{margin:12px 0}.rangebox .field{margin:0 0 6px}.numeric{width:88px;min-width:72px;padding:6px 8px;border-radius:9px;border:1px solid var(--ol);background:var(--s2);text-align:right}.rangebox>input[type=range]{width:100%}.field select{background:var(--s2);border:1px solid var(--ol);padding:8px 10px;border-radius:10px;max-width:58%}
.btn{width:100%;height:46px;border-radius:24px;background:var(--acc);color:#171020;font-weight:700;margin-top:10px}.btn.secondary{background:var(--s3);color:var(--on)}
.note{font-size:12px;color:var(--on2);line-height:1.55}
#hint{position:fixed;left:14px;top:116px;z-index:3;padding:12px 15px;border-radius:18px;max-width:280px;color:var(--on2);font-size:12px;pointer-events:none}#hint b{display:block;color:var(--on);font-size:14px;margin-bottom:4px}
#status{position:fixed;left:14px;bottom:calc(var(--dockH,64px) + 22px + env(safe-area-inset-bottom,0px));z-index:3;padding:10px 14px;border-radius:14px;color:var(--on2);font-size:12px;max-width:min(380px,calc(100% - 28px));pointer-events:none}

/* Левая колонка: инструкция сверху, миниатюры экранов строго под ней */
#hud-container{position:fixed;z-index:4;left:12px;top:112px;bottom:calc(var(--dockH,64px) + 88px + env(safe-area-inset-bottom,0px));width:280px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:2px 5px 10px 2px;scrollbar-width:thin;scrollbar-color:var(--ol) transparent;pointer-events:auto}
.hint-panel{position:relative;left:auto;top:auto;z-index:auto;width:100%;max-width:none;flex:0 0 auto;padding:12px 15px;border-radius:18px;color:var(--on2);font-size:12px;pointer-events:none}
.hint-panel b{display:block;color:var(--on);font-size:14px;margin-bottom:4px}
.screen-hud{position:relative;inset:auto;display:flex;flex-direction:column;width:100%;max-width:100%;min-width:0;flex:0 0 auto;padding:10px 12px;border-radius:16px;user-select:none;touch-action:auto}
.hud-header{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--on);font-weight:500}
.hud-close{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;min-width:30px;min-height:30px;background:rgba(255,255,255,.06);border:0;color:var(--on2);cursor:pointer;font-size:16px;padding:0 7px;border-radius:8px;pointer-events:auto;touch-action:manipulation}
.hud-close:hover{color:#ffb4ab;background:rgba(255,255,255,.06)}
/* ВАЖНО: глобальное правило canvas задаёт position:fixed для главной сцены.
   Миниатюры должны явно отменять его, иначе каждый мини-canvas становится
   полноэкранным фиксированным слоем и визуально перекрывает соседние карточки. */
#hud-container canvas{
  position:relative !important;
  inset:auto !important;
  display:block;
  width:100% !important;
  max-width:100%;
  height:auto !important;
  aspect-ratio:93 / 55;
  flex:none;
  touch-action:auto;
}
@media(max-width:600px){#hud-container{width:min(250px,calc(100vw - 12px));left:6px;top:108px;bottom:calc(var(--dockH,64px) + 88px + env(safe-area-inset-bottom,0px))}.screen-hud{padding:8px}.hint-panel{padding:10px 12px}}

/* Каталог добавления: поиск + тематические категории */
.element-menu{position:fixed;z-index:12;left:50%;bottom:86px;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));max-height:min(68vh,620px);overflow:auto;padding:16px;border-radius:22px}
.element-menu-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;font-weight:700;font-size:15px}
.element-menu-search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--ol);background:var(--s2);margin-bottom:10px;outline:none}
.element-menu-cats{display:flex;gap:6px;overflow-x:auto;padding:1px 1px 9px;scrollbar-width:thin}
.element-menu-cats .tg{height:32px;padding:0 10px;white-space:nowrap;font-size:12px}
.element-menu-cats .tg.active{background:var(--pr);color:#27154d;border-color:transparent}
.element-menu-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.element-menu-items .tg{height:auto;min-height:42px;padding:9px 10px;text-align:left;white-space:normal;line-height:1.25;background:rgba(255,255,255,.035)}
.element-menu-items .tg:hover{background:var(--s3)}
.element-menu-empty{grid-column:1/-1;color:var(--on2);padding:14px 4px;font-size:12px}
@media(max-width:640px){.element-menu-items{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:840px){.element-menu{bottom:76px;max-height:60vh;width:min(620px,calc(100vw - 16px))}}

#toast{position:fixed;left:50%;bottom:105px;transform:translate(-50%,35px);opacity:0;background:#e8e0ee;color:#322f35;padding:12px 18px;border-radius:14px;z-index:10;transition:.3s;pointer-events:none;text-align:center;max-width:90%;font-weight:500}#toast.on{opacity:1;transform:translate(-50%,0)}
.analysis-card{gap:8px;border:1px solid rgba(208,188,255,.18)}
.analysis-main{font-weight:700;font-size:13px;color:var(--on)}
.analysis-sub{font-size:11px;color:var(--on2);line-height:1.5}
.analysis-values{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.analysis-values span{display:block;padding:6px 8px;background:rgba(255,255,255,.045);border-radius:9px;font-size:11px;color:var(--on2)}
.analysis-values b{display:block;color:var(--on);font-size:12px;font-variant-numeric:tabular-nums}
@media(max-width:840px){#panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:57vh;transform:translateY(120%)}body.panel-open #panel{transform:none}body.panel-open #dock{transform:translate(-50%,160%)}#top h1{font-size:16px}#hint{top:112px;max-width:220px}#dock{gap:6px;padding:8px}.tg{height:36px;padding:0 10px;font-size:12px}}
body{background:radial-gradient(900px 620px at 12% 18%,rgba(120,70,200,.24),transparent 62%),radial-gradient(800px 600px at 92% 88%,rgba(40,150,210,.15),transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(255,90,90,.055) 38%,rgba(255,200,70,.055) 44%,rgba(90,255,150,.05) 50%,rgba(80,170,255,.055) 56%,rgba(170,100,255,.055) 62%,transparent 72%)}
.grow{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0;color:var(--on2)}.gl{width:74px;flex:none}.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.bar2{flex:1;height:7px;border-radius:4px;background:var(--s3);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--acc)}.grow b{width:42px;text-align:right;color:var(--on);font-weight:500}
.verdict{padding:10px 12px;border-radius:14px;font-size:12px;line-height:1.5;background:var(--s2)}.verdict.ok{background:#1f4d2c;color:#d8ffe0}.verdict.warn{background:#5a4a1a;color:#ffefc2}.verdict.no{background:#5a1f1a;color:#ffd9d4}
</style></head>
<body>
<canvas id="scene" aria-label="Интерактивная оптическая скамья"></canvas>
<header id="top" class="glass"><h1>Оптическая лаборатория</h1><span class="pill">⚛ <span class="lb">Физика света</span></span><span class="pill" id="readout">λ 650 нм</span></header>
<nav id="nav"></nav>
<div id="status" class="glass">Геометрическая оптика · координаты и расстояния в условных мм модели</div>
<div id="hud-container"></div>
<aside id="panel"></aside>
<div id="dock" class="glass"><button class="tg on" id="rays">Лучи: вкл.</button><button class="tg on" id="labels">Подписи</button><button class="tg" id="grid">Сетка</button><button class="tg" id="snap">Привязка: выкл.</button><button class="tg on" id="extensions">Продолжения</button><button class="tg" id="level">Режим: кратко</button><button class="tg primary" id="add">＋ Добавить элемент</button><button class="tg" id="reset">↺ Сброс</button></div>
<div id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),canvas=$('#scene'),ctx=canvas.getContext('2d');
let W,H,DPR,showRays=true,showLabels=true,showGrid=false,showExtensions=true,educationLevel=7,selected=null,drag=null,scale=1,offset={x:0,y:0};
let snapStep=0,extraRays=[];

const WAVE = [650, 610, 580, 550, 510, 470, 430, 400];
const modeName=()=>educationLevel===7?'кратко':'подробно';

const LENS_TYPES={
  lens:{name:'Двояковыпуклая',converging:true,shape:'double-convex'},
  divLens:{name:'Двояковогнутая',converging:false,shape:'double-concave'},
  planoConvex:{name:'Плосковыпуклая',converging:true,shape:'plano-convex'},
  meniscusConvex:{name:'Вогнуто-выпуклая',converging:true,shape:'positive-meniscus'},
  planoConcave:{name:'Плосковогнутая',converging:false,shape:'plano-concave'},
  meniscusConcave:{name:'Выпукло-вогнутая',converging:false,shape:'negative-meniscus'}
};
const isLensType=t=>!!LENS_TYPES[t];
const lensConverging=o=>LENS_TYPES[o.type]?.converging??o.type==='lens';
const defaults=()=>[
{id:1,type:'laser',x:115,y:310,angle:0,color:'#ff525e',wave:650,beams:5,spacing:8,power:1},
{id:2,type:'lens',x:420,y:310,f:150,diam:150,material:'glass'},
{id:3,type:'screen',x:700,y:310,w:8,h:230,angle:0,showHud:true,hudX:24,hudY:140}
];
let objects=defaults(),nextId=4;

const defs={
laser:{name:'Лазер',kind:'Источник света',color:'#ff626d',desc:'Монохроматический источник: фотоны имеют одну длину волны и идут в узком пучке.',fact:'Лазер излучает когерентный пучок одной длины волны.'},
bulb:{name:'Лампочка',kind:'Источник света',color:'#ffd27a',desc:'Тепловой источник излучает белый свет, содержащий весь спектр частот.',fact:'Белый свет распадается в призме благодаря дисперсии: показатель преломления n зависит от длины волны.'},
lens:{name:'Собирающая линза',kind:'Оптический элемент',color:'#8edcff',desc:'Выпуклая линза собирает параллельные лучи в фокусе.',fact:'Тонкая линза преломляет лучи пропорционально их удалению от оптической оси.'},
divLens:{name:'Рассеивающая линза',kind:'Оптический элемент',color:'#a6b5ff',desc:'Вогнутая линза делает параллельный пучок расходящимся.',fact:'Фокусное расстояние рассеивающей линзы отрицательно (f < 0).'},
prism:{name:'Призма',kind:'Преломляющая среда',color:'#d6b6ff',desc:'Стеклянная призма преломляет свет и разделяет белый свет на 7-8 цветов радуги.',fact:'Используется закон Снеллиуса и формула Коши для оптического стекла BK7.'},
mirror:{name:'Плоское зеркало',kind:'Отражатель',color:'#d5d9e8',desc:'Зеркало отражает луч: угол отражения равен углу падения.',fact:'Угол падения равен углу отражения относительно нормали.'},
screen:{name:'Экран',kind:'Детектор',color:'#9be3a8',desc:'Регистрирует точки пересечения лучей. Можно включить миниатюру и повернуть экран.',fact:'Реальное изображение можно получить на экране, если экран стоит в плоскости изображения.'},
object:{name:'Предмет AB',kind:'Объект наблюдения',color:'#ffd27a',desc:'Стрелка изображает предмет, от каждой точки которого расходятся световые лучи. Линза или зеркало создаёт его изображение.',fact:'Высота предмета и расстояние до линзы определяют положение, размер и ориентацию изображения.'},
ruler:{name:'Линейка',kind:'Измерительный инструмент',color:'#f4d58d',desc:'Линейка помогает измерять расстояния и положение элементов в условных миллиметрах модели.',fact:'Одна координатная единица сцены принята за 1 мм модели. Это масштаб симуляции, а не калибровка реального экрана.'},
protractor:{name:'Транспортир',kind:'Измерительный инструмент',color:'#c8b6ff',desc:'Транспортир помогает оценивать угол падения и угол отражения относительно нормали.',fact:'Углы падения и отражения измеряются от нормали к поверхности, а не от самой поверхности.'}
};
Object.assign(defs,{
  slab:{name:'Стеклянная пластина',kind:'Плоскопараллельная пластина',color:'#d6b6ff',desc:'Луч, проходя через пластину под углом, выходит параллельно себе, но смещается в сторону.',fact:'На каждой грани n1·sinα = n2·sinβ. Выходящий луч параллелен падающему; смещение растёт с толщиной и углом падения.'},
  rprism:{name:'Прямоугольная призма',kind:'Полное внутреннее отражение',color:'#d6b6ff',desc:'Свет заходит в катет, полностью отражается от гипотенузы и выходит под углом 90°.',fact:'Предельный угол для стекла ≈ 42°, а на гипотенузе угол падения 45° — луч не выходит, а отражается (полное внутреннее отражение). Так работают призменные бинокли и перископы.'},
  concave:{name:'Вогнутое зеркало',kind:'Собирающее зеркало',color:'#d9e5ff',desc:'Сферическое зеркало собирает параллельные лучи в фокусе. F — фокус, C — центр кривизны (C = 2F).',fact:'Зеркальная формула 1/f = 1/a + 1/b, f = R/2. Если предмет дальше фокуса — изображение действительное и перевёрнутое, ближе — мнимое и прямое.'},
  convex:{name:'Выпуклое зеркало',kind:'Рассеивающее зеркало',color:'#d9e5ff',desc:'Выпуклое зеркало рассеивает лучи. Изображение всегда мнимое, прямое и уменьшенное. Поэтому его ставят как зеркало заднего вида.',fact:'Фокус мнимый, f < 0 в формуле 1/f = 1/a + 1/b. Γ = −b/a, 0 < Γ < 1.'},
  grating:{name:'Дифракционная решётка',kind:'Дифракция и интерференция',color:'#ffb86b',desc:'Решётка разлагает свет в спектр: красный отклоняется сильнее фиолетового. Центральный луч остаётся прямым.',fact:'Максимумы: d·sinθ = m·λ, где d = 1/N — период решётки, m — порядок.'}
});
defs.glass={name:'Цветное стекло',kind:'Светофильтр',color:'#9be3a8',desc:'Цветное стекло пропускает лучи одного цвета и поглощает остальные. Поэтому белый свет за зелёным стеклом становится зелёным и тусклее.',fact:'Поглощающий светофильтр: пропускание T зависит от длины волны. Поглощённая энергия превращается в тепло.'};
Object.entries(LENS_TYPES).forEach(([type,l])=>{if(!defs[type])defs[type]={name:l.name+' линза',kind:'Оптический элемент',color:l.converging?'#8edcff':'#a6b5ff',desc:l.converging?'Собирающая линза: параллельные лучи после преломления сходятся к действительному фокусу.':'Рассеивающая линза: параллельные лучи после преломления расходятся, а их продолжения пересекаются в мнимом фокусе.',fact:'Форма линзы показана в поперечном сечении. Трассировка использует приближение тонкой линзы.'};});

function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(!offset.x)offset.x=W/2-410;if(!offset.y)offset.y=H/2-310}addEventListener('resize',resize);resize();
const wx=x=>(x-offset.x)/scale,wy=y=>(y-offset.y)/scale;
const byId=id=>objects.find(o=>o.id===id);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

function add(type){
  const anchor=selected?byId(selected):null;
  let x=anchor?anchor.x+130:330+Math.random()*150,y=anchor?anchor.y:310;

  if(isCurved(type))Object.assign(o,{f:100,diam:160,angle:0});

  if(type==='screen')Object.assign(o,{w:8,h:230,angle:0,showHud:false,hudX:24,hudY:140});
  if(type==='laser')Object.assign(o,{angle:0,color:'#ff525e',wave:650,beams:5,spacing:8});

function refract(I,N,n1,n2){

  return{x:(eta*I.x-(eta*cosi+Math.sqrt(k))*n.x)/l, y:(eta*I.y-(eta*cosi+Math.sqrt(k))*n.y)/l};

function norm(v){let l=Math.hypot(v.x,v.y)||1;return{x:v.x/l,y:v.y/l}}

  return pts.map(p=>({x:o.x+p.x*Math.cos(ang)-p.y*Math.sin(ang),y:o.y+p.x*Math.sin(ang)+p.y*Math.cos(ang)}));

function hitPrism(p,d,o){const v=prismVerts(o),n=v.length,hits=[];for(let i=0;i<n;i++){const a=v[i],b=v[(i+1)%n],h=raySegment(p,d,a,b);if(h){const edge=norm({x:b.x-a.x,y:b.y-a.y}),N={x:edge.y,y:-edge.x};hits.push({...h,N,edge,i})}}hits.sort((a,b)=>a.t-b.t);return hits[0]||null}

function indexGlass(l){let um=l/1000;return 1.5046+0.00420/(um*um)}

function wavelengthColor(w){
  let r=0,g=0,b=0;
  if(w>=380&&w<440){r=-(w-440)/60;b=1}
  else if(w<490){g=(w-440)/50;b=1}
  else if(w<510){g=1;b=-(w-510)/20}
  else if(w<580){r=(w-510)/70;g=1}
  else if(w<645){r=1;g=-(w-645)/65}
  else if(w<=700){r=1}
  let f=w<420?.3+.7*(w-380)/40:w>645?.3+.7*(700-w)/55:1;
  return `rgb(${Math.round(255*r*f)},${Math.round(255*g*f)},${Math.round(255*b*f)})`;
}

function isCurved(t){return t==='concave'||t==='convex'}
function isPrism(t){return t==='prism'||t==='slab'||t==='rprism'}
function isOpt(q){return isLensType(q.type)||q.type==='mirror'||isCurved(q.type)}
function mirrorL(o){return Math.min((o.diam||160)/2,1.2*Math.abs(o.f||100))}
function fmt(v){return Number.isFinite(v)?(Math.abs(v)>=100? v.toFixed(0):v.toFixed(1)).replace('.',','):'∞'}
function opticalElementFor(obj){
  if(!obj)return null;
  return objects.filter(q=>isOpt(q) && Math.abs(q.x-obj.x)>1e-4)
    .sort((a,b)=>Math.abs(a.x-obj.x)-Math.abs(b.x-obj.x))[0]||null;
}
function objectFor(element){
  if(!element)return null;
  return objects.filter(q=>q.type==='object' && Math.abs(q.x-element.x)>1e-4)
    .sort((a,b)=>Math.abs(element.x-a.x)-Math.abs(element.x-b.x))[0]||null;
}
function reflectPointAcrossLine(p,o){
  const a=o.angle*Math.PI/180, tangent={x:-Math.sin(a),y:Math.cos(a)};
  const v={x:p.x-o.x,y:p.y-o.y},proj=v.x*tangent.x+v.y*tangent.y;

// Цветное стекло = поглощающий светофильтр. T(λ)=T0·exp[−(λ−λ0)²/(2σ²)], σ=Δλ/2,355 (Δλ — ширина полосы на полувысоте)
const GLASS_T0=.92; // ~4% отражается от каждой из двух поверхностей
const glassT=(o,l)=>GLASS_T0*Math.exp(-Math.pow(l-o.wl,2)/(2*Math.pow((o.bw||80)/2.355,2)));
const glassColor=w=>wavelengthColor(Math.max(420,Math.min(650,w)));
const glassName=w=>w<455?'фиолетовое':w<495?'синее':w<570?'зелёное':w<590?'жёлтое':w<620?'оранжевое':'красное';
function glassExist(o){const b=o.bw;
  if(b>=300)return{c:'warn',t:'⚠ Почти нейтральное стекло: пропускает почти весь видимый свет и цвета практически не даёт.'};
  if(b>=40)return{c:'ok',t:'✔ Такое стекло может существовать: обычное цветное стекло (с красителем или оксидами металлов) имеет полосу пропускания 40–150 нм.'};
  if(b>=10)return{c:'warn',t:'⚠ Цветным стеклом так узко не получится. Такая полоса бывает у интерференционных светофильтров (тонкие слои покрытия).'};
  return{c:'no',t:'✕ Для стекла нереально: полоса уже 10 нм — это лазер или специальный интерференционный фильтр.'};}
function glassInfoHTML(o){
  const lasers=objects.filter(q=>q.type==='laser'),useW=objects.some(q=>q.type==='bulb')||!lasers.length;
  const ls=[...new Set([...lasers.map(q=>q.wave||650),...(useW?WAVE:[])])].sort((a,b)=>b-a),ex=glassExist(o);
  const rows=ls.map(l=>{const T=glassT(o,l);return `<div class="grow"><span class="gl"><i class="sw" style="background:${wavelengthColor(l)}"></i>${l} нм</span><span class="bar2"><i style="width:${(T*100).toFixed(1)}%"></i></span><b>${fmt(T*100)}%</b></div>`}).join('');
  const sl=lasers.length?(lasers[0].wave||650):650,sg=(o.bw||80)/2.355,dd=sl-o.wl,Ts=glassT(o,sl);
  const txt=educationLevel===7
    ?`Стекло красителем поглощает лучи «чужих» цветов и пропускает близкие к своему (${glassName(o.wl)}, около ${o.wl} нм). Поглощённая энергия нагревает стекло — поэтому за ним свет тусклее. Лазер другого цвета стекло почти не пропустит.`
    :`T(λ) = 0,92·exp[−(λ−λ₀)² / (2σ²)], σ = Δλ/2,355 = ${fmt(sg)} нм. Например, λ = ${sl} нм: λ−λ₀ = ${dd} нм, T = 0,92·exp(−${(dd*dd/(2*sg*sg)).toFixed(2)}) = ${fmt(Ts*100)}%. Яркость за стеклом I = T·I₀; доля 1−T = ${fmt((1-Ts)*100)}% поглощается и переходит в тепло. 0,92 — потери на отражение (≈4% на каждой поверхности). Несколько стёкол подряд: T перемножаются.`;
  return `<h3>Что пропускает стекло</h3><div class="verdict ${ex.c}">${ex.t}</div><div style="margin:10px 0">${rows}</div><p class="note">${txt}</p>`;
}
function gratingInfoHTML(o){
  const lasers=objects.filter(q=>q.type==='laser'),useW=objects.some(q=>q.type==='bulb')||!lasers.length;
  const ls=[...new Set([...lasers.map(q=>q.wave||650),...(useW?WAVE:[])])].sort((a,b)=>b-a),dnm=1e6/(o.lines||300);

  const txt=educationLevel===7
    ?'Решётка раскладывает свет в спектр: чем длиннее волна (красный), тем сильнее луч отклоняется. Центральный луч (нулевой порядок) не разлагается. Боковые лучи слабее по яркости.'

function panelAnalysisInner(i){return `<h3>Изображение предмета</h3><p class="note"><b>${i.headline}</b><br>${i.explanation}</p><div class="analysis-values"><span>a · расстояние до предмета<b>${fmt(i.do)} мм</b></span><span>b · расстояние до изображения<b>${fmt(i.di)} мм</b></span><span>f · фокус<b>${i.f===null?'—':fmt(i.f)+' мм'}</b></span><span>Γ · увеличение<b>${i.m===null?'—':fmt(i.m)}</b></span><span>h · высота предмета<b>${fmt(i.h0)} мм</b></span><span>h′ · высота изображения<b>${i.h1==null?'—':fmt(i.h1)+' мм'}</b></span><span>B над осью<b>${fmt(i.y0)} мм</b></span><span>B′ над осью<b>${i.y1==null?'—':fmt(i.y1)+' мм'}</b></span></div>`}
// Система тонких линз: изображение предыдущей линзы — предмет для следующей (1/f = 1/a + 1/b, Γ = Γ1·Γ2·…)
function getImageAnalysis(subject){
  const r=getImageAnalysisCore(subject);if(!r)return r;
  const f0=r.first||r.element;r.first=f0;r.h0=r.obj.height??80;r.y0=f0.y-r.obj.y;
  if(r.imageBaseY!=null&&r.imageTipY!=null&&Number.isFinite(r.imageTipY)){r.h1=r.imageBaseY-r.imageTipY;r.y1=(r.kind==='mirror'?r.first.y:r.element.y)-r.imageBaseY}else{r.h1=null;r.y1=null}

function getImageAnalysisCore(subject){

    const base={obj,element:first,first,stages:[],kind:'mirror',m:null,imageX:null,imageTipY:null,imageBaseY:null,virtual:false,real:false,f};
    if(a<=1e-4)return{...base,headline:'Предмет за зеркалом',explanation:'Отражающая сторона зеркала смотрит в другую сторону, поэтому изображения нет. Поверни зеркало на 180° или перенеси предмет.',do:Math.abs(a),di:Infinity};

function rays(){

function drawLensShape(c,o){

  let Ltop,Lmid,Lbot,Rtop,Rmid,Rbot;
  switch(shape){
    case 'double-convex': Ltop=-3;Lmid=-22;Lbot=-3;Rtop=3;Rmid=22;Rbot=3;break;
    case 'double-concave': Ltop=-18;Lmid=-5;Lbot=-18;Rtop=18;Rmid=5;Rbot=18;break;
    case 'plano-convex': Ltop=-7;Lmid=-7;Lbot=-7;Rtop=7;Rmid=29;Rbot=7;break;
    case 'plano-concave': Ltop=-12;Lmid=-12;Lbot=-12;Rtop=12;Rmid=-2;Rbot=12;break;
    case 'positive-meniscus': Ltop=-9;Lmid=-23;Lbot=-9;Rtop=9;Rmid=17;Rbot=9;break;
    case 'negative-meniscus': Ltop=-19;Lmid=-9;Lbot=-19;Rtop=19;Rmid=9;Rbot=19;break;
    default: Ltop=-3;Lmid=-22;Lbot=-3;Rtop=3;Rmid=22;Rbot=3;
  }
  // Каждая поверхность задаётся квадратичной кривой с точным центральным прогибом.

  c.moveTo(Ltop,-h);
  c.quadraticCurveTo(leftControl,0,Lbot,h);
  c.lineTo(Rbot,h);
  c.quadraticCurveTo(rightControl,0,Rtop,-h);
  c.closePath();
}

let pointers=new Map(),pinch=0;
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);drag=null;return}let x=wx(e.clientX),y=wy(e.clientY);let o=[...objects].reverse().find(q=>hit(q,x,y));if(o){select(o.id);drag={id:o.id,dx:x-o.x,dy:y-o.y,startX:e.clientX,startY:e.clientY,moved:false}}else{select(null);drag={pan:true,x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y}}};
canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch){let factor=d/pinch;scale=Math.max(.45,Math.min(2.2,scale*factor));pinch=d}return}if(!drag)return;if(drag.id&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>4)drag.moved=true;if(drag.pan){offset.x=drag.ox+e.clientX-drag.x;offset.y=drag.oy+e.clientY-drag.y}else{let o=byId(drag.id);if(o){let nx=wx(e.clientX)-drag.dx,ny=wy(e.clientY)-drag.dy;
if(snapStep){const sn=(v,c)=>c+Math.round((v-c)/snapStep)*snapStep; // ось (y = 310) и x = 0 — узлы сетки
  if(o.type==='ruler'){const Lh=(o.length||220)/2,a=(o.angle||0)*Math.PI/180,zx=sn(nx-Lh*Math.cos(a),0),zy=sn(ny-Lh*Math.sin(a),310);nx=zx+Lh*Math.cos(a);ny=zy+Lh*Math.sin(a)} // у линейки цепляется нулевая отметка
  else{nx=sn(nx,0);ny=sn(ny,310)}}
o.x=nx;o.y=ny;if(selected===o.id){let a=$('#panel .grid');if(a)a.innerHTML=`<div class="tile"><small>Координата X</small><b>${o.x.toFixed(0)} мм</b></div><div class="tile"><small>Координата Y</small><b>${o.y.toFixed(0)} мм</b></div>`}}}};
function end(e){pointers.delete(e.pointerId);if(!pointers.size){drag=null;pinch=0}}canvas.onpointerup=end;canvas.onpointercancel=end;
canvas.onwheel=e=>{e.preventDefault();let before=scale;scale=Math.max(.45,Math.min(2.2,scale*Math.exp(-e.deltaY*.001)));let x=e.clientX,y=e.clientY;offset.x=x-(x-offset.x)*scale/before;offset.y=y-(y-offset.y)*scale/before};

let elementMenu=null,elementCategory='Все';
function renderElementMenu(){
  if(!elementMenu)return;
  const query=(elementMenu.querySelector('.element-menu-search').value||'').trim().toLocaleLowerCase('ru');
  const categories=['Все','Источники','Линзы','Преломление','Отражение','Светофильтры','Дифракция','Измерения'];
  elementMenu.querySelector('.element-menu-cats').innerHTML=categories.map(c=>`<button class="tg ${elementCategory===c?'active':''}" data-category="${c}">${c}</button>`).join('');
  const items=ELEMENT_CATALOG.filter(item=>(elementCategory==='Все'||item.category===elementCategory)&&(!query||(item.label+' '+item.keywords).toLocaleLowerCase('ru').includes(query)));
  elementMenu.querySelector('.element-menu-items').innerHTML=items.length?items.map(item=>`<button class="tg" data-type="${item.type}">${item.label}</button>`).join(''):'<div class="element-menu-empty">Ничего не найдено. Попробуй изменить запрос или категорию.</div>';
}
$('#add').onclick=()=>{
  if(elementMenu){elementMenu.remove();elementMenu=null;return;}
  elementMenu=document.createElement('section');elementMenu.className='glass element-menu';
  elementMenu.innerHTML=`<div class="element-menu-head"><span>Добавить элемент</span><button class="hud-close" data-menu-close aria-label="Закрыть">✕</button></div><input class="element-menu-search" type="search" placeholder="Поиск: например, линза или экран" autocomplete="off"><div class="element-menu-cats"></div><div class="element-menu-items"></div>`;
  document.body.append(elementMenu);elementCategory='Все';renderElementMenu();
  elementMenu.querySelector('.element-menu-search').addEventListener('input',renderElementMenu);
  elementMenu.addEventListener('click',e=>{
    const close=e.target.closest('[data-menu-close]');if(close){elementMenu.remove();elementMenu=null;return;}
    const cat=e.target.closest('[data-category]');if(cat){elementCategory=cat.dataset.category;renderElementMenu();return;}
    const item=e.target.closest('[data-type]');if(item){const type=item.dataset.type;elementMenu.remove();elementMenu=null;add(type);}
  });
  const outside=e=>{if(elementMenu&&!elementMenu.contains(e.target)&&e.target!==$('#add')){elementMenu.remove();elementMenu=null;document.removeEventListener('pointerdown',outside)}};
  setTimeout(()=>document.addEventListener('pointerdown',outside),0);
  elementMenu.querySelector('.element-menu-search').focus();
};

// Высота нижней панели → CSS-переменная (на узких экранах кнопки переносятся на несколько строк)
{const dock=$('#dock'),setDock=()=>document.documentElement.style.setProperty('--dockH',dock.offsetHeight+'px');setDock();addEventListener('resize',setDock);if(window.ResizeObserver)new ResizeObserver(setDock).observe(dock)}
// Горячие клавиши: e.code — физическая клавиша, поэтому Ctrl+C работает и в русской раскладке
let clip=null,pasteN=0;
const typingTarget=e=>{const t=e.target;if(!t||!t.tagName)return false;if(t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)return true;return t.tagName==='INPUT'&&!['range','checkbox','button'].includes(t.type)};
const copySel=()=>{const o=byId(selected);if(!o)return false;clip=JSON.parse(JSON.stringify(o));pasteN=0;return true};
const pasteClip=()=>{if(!clip)return;const c=JSON.parse(JSON.stringify(clip));c.id=nextId++;pasteN++;c.x+=30*pasteN;c.y+=30*pasteN;objects.push(c);select(c.id);toast('Вставлено')};
document.addEventListener('keydown',e=>{
  if(typingTarget(e))return;
  const mod=e.ctrlKey||e.metaKey,code=e.code||'';
  if(code==='Escape'){select(null);return}
  if(mod&&code==='KeyC'){if(String(getSelection()).length)return;if(copySel()){e.preventDefault();toast('Скопировано')}return}
  if(mod&&code==='KeyV'){if(clip){e.preventDefault();pasteClip()}return}
  if(mod&&code==='KeyD'){if(copySel()){e.preventDefault();pasteClip()}return}
  if(code==='Delete'||code==='Backspace'){const o=byId(selected);if(o){e.preventDefault();objects=objects.filter(q=>q.id!==o.id);select(null);toast('Элемент удалён')}return}
  if(code.startsWith('Arrow')&&!(e.target&&e.target.type==='range')){
    const o=byId(selected);if(!o)return;e.preventDefault();const st=e.shiftKey?10:1;
    o.x+=code==='ArrowRight'?st:code==='ArrowLeft'?-st:0;o.y+=code==='ArrowDown'?st:code==='ArrowUp'?-st:0;
    const g=$('#panel .grid');if(g)g.innerHTML=`<div class="tile"><small>Координата X</small><b>${o.x.toFixed(0)} мм</b></div><div class="tile"><small>Координата Y</small><b>${o.y.toFixed(0)} мм</b></div>`;
  }
});
