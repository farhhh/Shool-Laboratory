<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Электрическая лаборатория — сборка цепей</title>
<style>@font-face{font-family:"Roboto Flex";font-style:normal;font-weight:400 900;font-display:swap;src:url("../../fonts/roboto-flex.woff") format("woff")}</style><style>
:root{color-scheme:dark;--bg:#0b0912;--s1:#1d1a24;--s2:#272330;--s3:#322d3d;--on:#e8e0ee;--on2:#cbc3d4;--ol:#4b4556;--pr:#d0bcff;--acc:#d0bcff;--ok:#9be3a8;--er:#ffb4ab;box-sizing:border-box}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--on);font:400 14px/1.45 "Roboto Flex",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(900px 620px at 12% 18%,rgba(120,70,200,.24),transparent 62%),radial-gradient(800px 600px at 92% 88%,rgba(40,150,210,.15),transparent 60%),var(--bg)}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}#gr{position:static;display:block;width:100%;height:auto}button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.glass{background:rgba(29,26,36,.94);border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:9px 12px 9px 18px;border-radius:28px;z-index:5}
#top h1{font:900 19px/1 "Roboto Flex";letter-spacing:-.4px;flex:1;white-space:nowrap;background:linear-gradient(90deg,#ffe29a,#ffb0c8,var(--pr));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{padding:8px 13px;border-radius:16px;background:var(--s2);font-weight:500;white-space:nowrap}
#nav{position:fixed;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top,0px));display:flex;gap:8px;overflow-x:auto;padding:2px;z-index:4;scrollbar-width:none}#nav::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--ol);background:rgba(29,26,36,.7);white-space:nowrap;font-weight:500}.chip:hover{background:var(--s3)}
#dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:30px;z-index:5;max-width:calc(100% - 16px);flex-wrap:wrap;justify-content:center}
.tg{height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--ol);font-weight:500;white-space:nowrap}.tg.on{background:#4a4458;color:#eaddff;border-color:transparent}.tg.tool.on{background:var(--pr);color:#27154d;font-weight:700}.sep{width:1px;height:26px;background:var(--ol)}
#hud{position:fixed;left:12px;top:116px;width:276px;max-height:calc(100% - 240px);overflow:auto;z-index:4;padding:14px;border-radius:20px;font-size:12px;color:var(--on2);scrollbar-width:thin}
#hud b.t{display:block;color:var(--on);font-size:14px;margin-bottom:6px}.verdict{padding:10px 12px;border-radius:14px;line-height:1.5;background:var(--s2);margin-bottom:8px}.verdict.ok{background:#1f4d2c;color:#d8ffe0}.verdict.warn{background:#5a4a1a;color:#ffefc2}.verdict.no{background:#5a1f1a;color:#ffd9d4}
.fm{display:block;padding:7px 10px;margin:5px 0;border-radius:10px;background:rgba(255,255,255,.05);color:var(--on);font-size:12.5px;font-variant-numeric:tabular-nums}.fm small{display:block;color:var(--on2);font-size:10.5px}
.grow{display:flex;align-items:center;gap:8px;margin:5px 0}.gl{width:78px;flex:none}.bar2{flex:1;height:7px;border-radius:4px;background:var(--s3);overflow:hidden}.bar2 i{display:block;height:100%}.grow b{width:38px;text-align:right;color:var(--on);font-weight:500}
.lg{display:flex;align-items:center;gap:8px;margin-top:8px}.lg i{width:9px;height:9px;border-radius:50%}
#panel{position:fixed;z-index:6;background:var(--s1);border-radius:28px;overflow:auto;right:12px;top:116px;bottom:12px;width:340px;transform:translateX(120%);padding:20px;transition:transform .45s cubic-bezier(.2,0,0,1);box-shadow:0 20px 60px #000a}body.panel-open #panel{transform:none}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;background:var(--s2)}
.hero{display:flex;gap:14px;align-items:center;padding-right:35px}.orb{width:56px;height:56px;flex:none;border-radius:50%;box-shadow:0 0 30px var(--acc),inset -12px -9px 18px #000a;background:radial-gradient(circle at 32% 30%,#fff9,var(--acc) 38%,#000 130%)}.kind{color:var(--acc);font-weight:700}h2{font:900 26px/1.05 "Roboto Flex";letter-spacing:-.6px}
.fact{margin:15px 0;padding:13px 15px;border-radius:20px 20px 20px 6px;background:var(--s2);color:var(--on2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{padding:10px 13px;border-radius:15px;background:var(--s2)}.tile small{display:block;color:var(--on2);font-size:12px}.tile b{font-weight:500}
.field{margin:14px 0 4px;color:var(--on2);display:flex;justify-content:space-between}.field b{color:var(--on);font-weight:500}input[type=range]{width:100%;accent-color:var(--pr)}
.btn{width:100%;height:44px;border-radius:24px;background:var(--acc);color:#171020;font-weight:700;margin-top:12px}.btn.secondary{background:var(--s3);color:var(--on)}
#menu{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;padding:12px;border-radius:24px;display:none;grid-template-columns:repeat(4,1fr);gap:8px;width:min(560px,calc(100% - 16px))}#menu.on{display:grid}#menu button{padding:11px;border-radius:14px;border:1px solid var(--ol);background:rgba(255,255,255,.035);display:flex;align-items:center;gap:8px;font-weight:500;text-align:left}#menu button:hover{background:var(--s3)}#menu i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.tg.primary{background:var(--pr);color:#27154d;border-color:transparent;font-weight:700}.tg.primary.on{background:var(--s3);color:var(--on)}
@media(max-width:840px){#menu{grid-template-columns:repeat(2,1fr);bottom:calc(120px + env(safe-area-inset-bottom,0px))}}
#toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,35px);opacity:0;background:#e8e0ee;color:#322f35;padding:12px 18px;border-radius:14px;z-index:10;transition:.3s;pointer-events:none;text-align:center;max-width:90%;font-weight:500}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:840px){#panel{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:57vh;transform:translateY(120%)}body.panel-open #panel{transform:none}body.panel-open #dock{transform:translate(-50%,160%)}#top h1{font-size:16px}#hud{width:calc(100% - 24px);max-height:24vh;padding:10px}#dock{gap:6px;padding:8px}.tg{height:36px;padding:0 10px;font-size:12px}}
</style></head>
<body>
<canvas id="scene" aria-label="Поле для сборки электрической цепи"></canvas>
<header id="top" class="glass"><h1>Электрическая лаборатория</h1><span class="pill" id="readout">⚡</span></header>
<nav id="nav"><button class="chip" data-p="simple">Простая цепь</button><button class="chip" data-p="short">Замыкание + и −</button><button class="chip" data-p="par">Параллельное соединение</button><button class="chip" data-p="rc">Заряд конденсатора</button><button class="chip" data-p="led">Светодиод и резистор</button><button class="chip" data-p="clear">Пустое поле</button></nav>
<div id="hud" class="glass"></div>
<aside id="panel"></aside>
<div id="dock" class="glass">
<button class="tg tool" data-tool="wire">Провод</button><button class="tg tool" data-tool="erase">Ластик</button><button class="tg primary" id="add">＋ Элементы</button><span class="sep"></span>
<button class="tg" id="rot" title="Повернуть выбранный элемент (R)">↻ Повернуть</button><button class="tg" id="home" title="К центру">⌖</button><button class="tg" id="ts">Время: 1×</button><button class="tg" id="flow">Ток: условный</button><button class="tg" id="grid">Сетка</button><button class="tg" id="level">Режим: кратко</button>
</div>
<div id="menu" class="glass"></div>
<div id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),cv=$('#scene'),ctx=cv.getContext('2d');
let W,H,DPR,c=36,ox=0,oy=0,tool=null,rot=0,showGrid=false,electrons=false,detail=false,sel=null,hover=null,drag=null,els=[],nid=0,dirty=true,T=0,last=0;
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]],key=p=>p[0]+','+p[1],GW=100;
const D={
ind:{n:'Катушка индуктивности',k:'Накопитель энергии',col:'#c3a6ff',d:'Провод, свёрнутый в витки. Мешает току меняться: ток растёт и спадает не мгновенно.',f:'U = L·ΔI/Δt, W = L·I²/2. Для постоянного тока в установившемся режиме катушка — просто провод.'},
led:{n:'Светодиод',k:'Полупроводник',col:'#ff6b8a',d:'Пропускает ток только в одну сторону: от анода к катоду (остриё треугольника смотрит на катод). Светится от ≈2 В.',f:'Рабочий ток ≈ 20 мА. Без резистора светодиод сгорит: R = (U − 2 В)/0,02 А.'},
fuse:{n:'Предохранитель',k:'Защита',col:'#ffcf70',d:'Тонкая проволочка: плавится, когда ток больше номинала, и размыкает цепь.',f:'При коротком замыкании он перегорает первым и спасает батарею и провода. Чтобы защитить светодиод (он гибнет при токе > 60 мА), нужен номинал меньше ≈ 50 мА, то есть 0,05 А.'},
btn:{n:'Кнопка',k:'Коммутация',col:'#9be3a8',d:'Замыкает цепь, пока вы держите её нажатой. Нажмите и держите.',f:'Тот же разрыв цепи, что у ключа, но без фиксации — как звонок или клавиша.'},
cap:{n:'Конденсатор',k:'Накопитель заряда',col:'#8edcff',d:'Две пластины с зазором. Заряжается и копит энергию, а постоянный ток через него потом не идёт.',f:'q = C·U, W = C·U²/2. Заряд идёт за время порядка τ = R·C.'},
vm:{n:'Вольтметр',k:'Измерительный прибор',col:'#ffb0c8',d:'Круг с буквой V. Подключается параллельно участку и показывает напряжение. Его сопротивление огромно (≈10 МОм).',f:'Включите вольтметр последовательно — он «разорвёт» цепь, и ток почти исчезнет.'},
am:{n:'Амперметр',k:'Измерительный прибор',col:'#a6b5ff',d:'Круг с буквой A. Включается последовательно, в разрыв цепи, и показывает ток. Его сопротивление очень мало.',f:'Подключите амперметр параллельно — получится короткое замыкание!'},
bat:{n:'Батарея',k:'Источник питания',col:'#ffb86b',d:'Разделяет заряды и создаёт напряжение. Длинная чёрточка — «+», короткая — «−».',f:'У реальной батареи есть внутреннее сопротивление r, поэтому напряжение на клеммах U = E − I·r меньше э.д.с.'},
bulb:{n:'Лампа накаливания',k:'Потребитель',col:'#ffd27a',d:'Нить нагревается током и светится. На схеме — круг с крестиком. Лампа 6 В / 3 Вт.',f:'R = U²/P = 6²/3 = 12 Ом. Яркость растёт с мощностью P = U·I.'},
res:{n:'Резистор',k:'Потребитель',col:'#8edcff',d:'Ограничивает ток, превращая энергию в тепло. На схеме — прямоугольник.',f:'Закон Ома: I = U/R. Больше R — меньше ток.'},
sw:{n:'Ключ',k:'Коммутация',col:'#9be3a8',d:'Замыкает и размыкает цепь. Нажмите на него, чтобы переключить.',f:'Разомкнутый ключ — это воздушный зазор: сопротивление огромное, тока нет.'},
wire:{n:'Провод',k:'Проводник',col:'#cbc3d4',d:'Почти не мешает току, но сопротивление у него не нулевое (здесь 0,01 Ом на клетку).',f:'При огромном токе даже провод греется: Q = I²·R·t. Поэтому нужны предохранители.'}};
const mk=(t,a,b,o={})=>({id:++nid,t,a,b,v:t==='bat'?6:t==='res'?20:t==='cap'?100:t==='ind'?1000:t==='fuse'?1:0,r:.5,on:t!=='btn',vc:0,il:0,fw:false,dead:false,I:0,dv:0,P:0,h:0,br:0,g:1,...o});
const comp=(t,x,y,d,o)=>mk(t,[x,y],[x+DIRS[d][0]*2,y+DIRS[d][1]*2],o);
function addWire(x1,y1,x2,y2){const sx=Math.sign(x2-x1),sy=Math.sign(y2-y1),n=Math.abs(x2-x1)+Math.abs(y2-y1);let x=x1,y=y1;for(let i=0;i<n;i++){const nx=x+sx,ny=y+sy;if(!els.some(e=>e.t==='wire'&&((key(e.a)==x+','+y&&key(e.b)==nx+','+ny)||(key(e.b)==x+','+y&&key(e.a)==nx+','+ny))))if(!covered([x,y],[nx,ny]))els.push(mk('wire',[x,y],[nx,ny]));x=nx;y=ny}}
const onSeg=(p,a,b)=>(a[0]==b[0]&&p[0]==a[0]&&p[1]>=Math.min(a[1],b[1])&&p[1]<=Math.max(a[1],b[1]))||(a[1]==b[1]&&p[1]==a[1]&&p[0]>=Math.min(a[0],b[0])&&p[0]<=Math.max(a[0],b[0]));
const covered=(p,q)=>els.some(e=>e.t!=='wire'&&onSeg(p,e.a,e.b)&&onSeg(q,e.a,e.b));
function place(t,a){const d=DIRS[rot],b=[a[0]+d[0]*2,a[1]+d[1]*2];els=els.filter(e=>!(onSeg(e.a,a,b)&&onSeg(e.b,a,b)));els.push(mk(t,a,b));dirty=true}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;c=Math.max(26,Math.min(44,Math.floor(Math.min(W/16,H/13))));ox=0;oy=0;dirty=true}
function center(){const m=W<=840,t=m?116+.24*H:120,b=H-(m?110:90);cam.z=1;cam.x=(m?W:W+292)/2;cam.y=(t+b)/2;return[0,0]}
const PRE={
simple(x,y){addWire(x-4,y-3,x-4,y-1);addWire(x-4,y+1,x-4,y+3);addWire(x-4,y-3,x-1,y-3);addWire(x+1,y-3,x+4,y-3);addWire(x+4,y-3,x+4,y+3);addWire(x+4,y+3,x+1,y+3);addWire(x-1,y+3,x-4,y+3);els.push(comp('bat',x-4,y-1,1),comp('bulb',x-1,y-3,0),comp('sw',x+1,y+3,2))},
short(x,y){addWire(x-4,y-3,x-4,y-1);addWire(x-4,y+1,x-4,y+3);addWire(x-4,y-3,x+4,y-3);addWire(x+4,y-3,x+4,y+3);addWire(x+4,y+3,x+1,y+3);addWire(x-1,y+3,x-4,y+3);els.push(comp('bat',x-4,y-1,1),comp('sw',x+1,y+3,2,{on:false}));toast('Замкните ключ — и посмотрите, что будет')},
par(x,y){addWire(x-5,y-3,x-5,y-1);addWire(x-5,y+1,x-5,y+3);addWire(x-5,y-3,x+4,y-3);addWire(x-5,y+3,x+4,y+3);els.push(comp('bat',x-5,y-1,1));for(const[bx,t]of[[-1,'bulb'],[2,'bulb'],[4,'res']]){addWire(x+bx,y-3,x+bx,y-1);addWire(x+bx,y+1,x+bx,y+3);els.push(comp(t,x+bx,y-1,1))}},
rc(x,y){addWire(x-4,y-3,x-4,y-1);addWire(x-4,y+1,x-4,y+3);addWire(x-4,y-3,x-1,y-3);addWire(x+1,y-3,x+4,y-3);addWire(x+4,y-3,x+4,y-1);addWire(x+4,y+1,x+4,y+3);addWire(x+4,y+3,x+1,y+3);addWire(x-1,y+3,x-4,y+3);els.push(comp('bat',x-4,y-1,1),comp('res',x-1,y-3,0),comp('cap',x+4,y-1,1),comp('sw',x+1,y+3,2,{on:false}));toast('Замкните ключ, выберите конденсатор — в подробном режиме будет график')},
led(x,y){addWire(x-4,y-3,x-4,y-1);addWire(x-4,y+1,x-4,y+3);addWire(x-4,y-3,x-3,y-3);addWire(x-1,y-3,x,y-3);addWire(x+2,y-3,x+4,y-3);addWire(x+4,y-3,x+4,y+3);addWire(x+4,y+3,x-4,y+3);els.push(comp('bat',x-4,y-1,1),comp('led',x-3,y-3,0),comp('res',x,y-3,0,{v:200}));toast('Уберите резистор и замкните цепь проводом — светодиод сгорит')},
clear(){}};
function load(n){els=[];sel=null;const[cx,cy]=center();PRE[n](cx,cy);dirty=true;panel()}
/* ---------- расчёт: метод узловых потенциалов ---------- */
const SW=t=>t==='sw'||t==='btn',hasDyn=()=>els.some(e=>e.t==='cap'||e.t==='ind'||e.t==='led'||e.t==='fuse'),VF=2;
const Eof=e=>e.t==='bat'?e.v:e.t==='cap'?e.vc:e.t==='ind'?-e.il/e.g:(e.t==='led'&&e.fw&&!e.dead)?VF:0;
function solve(dt,rdt){rdt=rdt||dt;const act=els.filter(e=>!e.mv);els.forEach(e=>{if(e.mv)e.I=e.dv=e.P=e.h=e.br=0});
const leds=act.filter(e=>e.t==='led'&&!e.dead);let V;
for(let it=0;it<(leds.length?12:1);it++){
const idx=new Map();for(const e of act)for(const p of[e.a,e.b]){const k=key(p);if(!idx.has(k))idx.set(k,idx.size)}
const n=idx.size,A=Array.from({length:n},()=>new Float64Array(n+1));
for(const e of act){const i=idx.get(key(e.a)),j=idx.get(key(e.b));
const g=e.t==='wire'||e.t==='am'?GW:e.t==='bat'?1/e.r:e.t==='bulb'?1/12:e.t==='res'?1/e.v:e.t==='vm'?1e-7:e.t==='cap'?(e.v/1000)/dt:e.t==='ind'?dt/(e.v/1000):e.t==='led'?(e.dead||!e.fw?1e-9:.1):e.t==='fuse'?(e.dead?1e-7:20):SW(e.t)&&!e.on?1e-7:GW;
e.g=g;e.i=i;e.j=j;A[i][i]+=g;A[j][j]+=g;A[i][j]-=g;A[j][i]-=g;const E=Eof(e);if(E){A[i][n]+=E*g;A[j][n]-=E*g}}
for(let i=0;i<n;i++)A[i][i]+=1e-9;
for(let k=0;k<n;k++){let p=k;for(let r=k+1;r<n;r++)if(Math.abs(A[r][k])>Math.abs(A[p][k]))p=r;[A[k],A[p]]=[A[p],A[k]];const pv=A[k][k];
for(let r=k+1;r<n;r++){const f=A[r][k]/pv;if(!f)continue;for(let q=k;q<=n;q++)A[r][q]-=f*A[k][q]}}
V=new Float64Array(n);for(let i=n-1;i>=0;i--){let s=A[i][n];for(let q=i+1;q<n;q++)s-=A[i][q]*V[q];V[i]=s/A[i][i]}
let ch=false;for(const e of leds){const nf=V[e.i]-V[e.j]>VF;if(nf!==e.fw){e.fw=nf;ch=true}}if(!ch)break}
for(const e of act){e.dv=V[e.i]-V[e.j];const open=SW(e.t)&&!e.on;
e.I=open?0:(e.dv-Eof(e))*e.g;
e.P=open||e.t==='vm'||e.t==='cap'||e.t==='ind'?0:e.t==='bat'?e.I*e.I*e.r:e.t==='led'?Math.max(0,e.I*e.dv):e.I*e.I/e.g;

cv.addEventListener('wheel',ev=>{ev.preventDefault();zoomAt(ev.clientX,ev.clientY,Math.exp(-ev.deltaY*(ev.ctrlKey?.01:.0015)))},{passive:false});

$('#menu').innerHTML=['bat','bulb','led','res','cap','ind','fuse','sw','btn','vm','am'].map(t=>`<button data-t="${t}"><i style="color:${D[t].col};background:${D[t].col}"></i>${D[t].n}</button>`).join('');
$('#menu').onclick=e=>{const b=e.target.closest('button');if(b)setTool(b.dataset.t)};
$('#add').onclick=()=>{if(D[tool]&&tool!=='wire')setTool(null);else $('#menu').classList.toggle('on')};$('#ts').onclick=e=>{ts=ts===1?.2:ts===.2?.05:1;e.target.textContent='Время: '+ts+'×';e.target.classList.toggle('on',ts!==1)};

/* ---------- панель и HUD ---------- */
function panel(){const e=sel,P=$('#panel');if(!e){document.body.classList.remove('panel-open');return}
const d=D[e.t];let ctl='';
if(e.t==='bat')ctl=`<div class="field">Э.д.с. E<b id="vE">${e.v} В</b></div><input type="range" id="rE" min="1" max="24" step=".5" value="${e.v}"><div class="field">Внутреннее сопротивление r<b id="vr">${e.r} Ом</b></div><input type="range" id="rr" min=".05" max="2" step=".05" value="${e.r}">`;
if(e.t==='res')ctl=`<div class="field">Сопротивление R<b id="vR">${e.v} Ом</b></div><input type="range" id="rR" min="1" max="200" step="1" value="${e.v}">`;
if(e.t==='cap')ctl=`<div class="field">Ёмкость C<b id="vC">${e.v} мФ</b></div><input type="range" id="rC" min="1" max="1000" step="1" value="${e.v}"><button class="btn secondary" id="dis">Разрядить</button>`;
if(e.t==='ind')ctl=`<div class="field">Индуктивность L<b id="vL">${e.v} мГн</b></div><input type="range" id="rL" min="10" max="5000" step="10" value="${e.v}"><button class="btn secondary" id="dis">Обнулить ток</button>`;
if(e.t==='fuse')ctl=`<div class="field">Номинал<b id="vF">${e.v} А</b></div><input type="range" id="rF" min=".01" max="5" step=".01" value="${e.v}"><button class="btn secondary" id="fix">Заменить предохранитель</button>`;
if(e.t==='led')ctl=`<button class="btn secondary" id="fix">Заменить светодиод</button>`;
if(e.t==='sw')ctl=`<button class="btn secondary" id="tsw">${e.on?'Разомкнуть':'Замкнуть'}</button>`;
P.innerHTML=`<button class="x" id="cl">✕</button><div class="hero"><div class="orb" style="--acc:${d.col}"></div><div><div class="kind" style="color:${d.col}">${d.k}</div><h2>${d.n}</h2></div></div><div class="fact">${d.d}<br><br>${d.f}</div><div class="grid" id="tiles"></div><div class="fm" id="pf" style="margin-top:10px"></div>${graphHTML(e)}${ctl}<button class="btn" id="del">Удалить элемент</button>`;
document.body.classList.add('panel-open');$('#cl').onclick=()=>{sel=null;panel();dirty=true};$('#del').onclick=()=>{els=els.filter(x=>x!==e);sel=null;panel();dirty=true};
const bind=(id,lab,fn,u)=>{const r=$(id);if(r)r.oninput=()=>{fn(+r.value);$(lab).textContent=r.value+' '+u;dirty=true}};
bind('#rE','#vE',v=>e.v=v,'В');bind('#rr','#vr',v=>e.r=v,'Ом');bind('#rR','#vR',v=>e.v=v,'Ом');bind('#rC','#vC',v=>e.v=v,'мФ');if($('#dis'))$('#dis').onclick=()=>{e.vc=0;e.il=0;dirty=true};bind('#rL','#vL',v=>e.v=v,'мГн');bind('#rF','#vF',v=>e.v=v,'А');if($('#fix'))$('#fix').onclick=()=>{e.dead=false;e.hot=0;e.burn=0;dirty=true};
if($('#tsw'))$('#tsw').onclick=()=>{e.on=!e.on;panel();dirty=true}}
const graphHTML=e=>(e.t==='cap'||e.t==='ind')?(detail?'<canvas id="gr" width="300" height="140" style="width:100%;border-radius:14px;background:#14111b;margin-top:10px"></canvas><div id="grl" style="margin-top:4px;font-size:12px;color:var(--on2)"></div>':'<div style="margin-top:10px;font-size:12px;color:var(--on2)">Включите «Режим: подробно» — появится график U(t) и I(t).</div>'):'';
function graph(){const g=$('#gr');if(!g||!sel||!sel.hist||sel.hist.length<2)return;const x=g.getContext('2d'),w=g.width,h=g.height,Hh=sel.hist;x.clearRect(0,0,w,h);
const mu=Math.max(.01,...Hh.map(p=>Math.abs(p[1]))),mi=Math.max(.001,...Hh.map(p=>Math.abs(p[2]))),t0=Hh[0][0],t1=Hh[Hh.length-1][0];
const cur=(k,m,col)=>{x.strokeStyle=col;x.lineWidth=2;x.beginPath();Hh.forEach((p,j)=>{const X=8+(p[0]-t0)/(t1-t0||1)*(w-16),Y=h/2-(p[k]/m)*(h/2-14);j?x.lineTo(X,Y):x.moveTo(X,Y)});x.stroke()};
x.strokeStyle='rgba(255,255,255,.12)';x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();cur(1,mu,'#8edcff');cur(2,mi,'#ffd27a');
$('#grl').innerHTML=`<span style="color:#8edcff">━ U(t), макс ${f2(mu)} В</span> &nbsp; <span style="color:#ffd27a">━ I(t), макс ${f2(mi)} А</span><br>последние ${f2(t1-t0)} с модельного времени`}
function tilesFor(e,t){const I=Math.abs(e.I),U=Math.abs(e.dv),R=SW(e.t)&&!e.on?'∞':f2(1/e.g),T4=(a,b)=>`<div class="tile"><small>${a}</small><b>${b}</b></div>`;let h,f;
if(e.t==='bat'){h=T4('Ток отдачи I',f2(-e.I)+' А')+T4('Напряжение на клеммах',f2(e.dv)+' В')+T4('Тепло в r: I²·r',f2(e.P)+' Вт')+T4('Мощность E·I',f2(-e.I*e.v)+' Вт');f=`U = E − I·r = ${e.v} − ${f2(-e.I)}·${e.r} = ${f2(e.dv)} В`}
else if(e.t==='cap'){h=T4('Напряжение U',f2(e.dv)+' В')+T4('Ток I',f2(e.I)+' А')+T4('Заряд q = C·U',f2(e.v*e.dv)+' мКл')+T4('Энергия W',f2(e.v*e.dv*e.dv/2)+' мДж');f=`q = C·U = ${e.v}·${f2(e.dv)} = ${f2(e.v*e.dv)} мКл<small>W = C·U²/2; время зарядки ~ τ = R·C</small>`}
else if(e.t==='ind'){h=T4('Ток I',f2(e.I)+' А')+T4('Напряжение U',f2(e.dv)+' В')+T4('Энергия W = L·I²/2',f2(e.v*e.I*e.I/2)+' мДж')+T4('Индуктивность L',e.v/1000+' Гн');f='U = L·ΔI/Δt<small>пока ток меняется — на катушке есть напряжение; в установившемся режиме U ≈ 0</small>'}
else if(e.t==='led'){h=T4('Ток I',f2(e.I*1000)+' мА')+T4('Напряжение U',f2(e.dv)+' В')+T4('Яркость',Math.round(Math.min(e.br,1)*100)+'%')+T4('Состояние',e.dead?'сгорел':e.fw?'светит':'закрыт');f='Падение напряжения ≈ 2 В, рабочий ток ≈ 20 мА<small>Ток > 60 мА убивает светодиод</small>'}
else if(e.t==='fuse'){h=T4('Ток I',f2(I)+' А')+T4('Номинал',e.v+' А')+T4('Нагрев нити',Math.round(Math.min(1,(e.hot||0)/.15)*100)+'%')+T4('Состояние',e.dead?'перегорел':'цел');f='Перегорает, если I > '+e.v+' А достаточно долго'}
else if(e.t==='vm'){h=T4('Показание U',f2(e.dv)+' В')+T4('Сопротивление','≈10 МОм');f='U = φ₁ − φ₂ — разность потенциалов'}
else if(e.t==='am'){h=T4('Показание I',f2(e.I)+' А')+T4('Сопротивление','0,01 Ом');f='I = Δq/Δt — заряд за секунду'}
else{h=T4('Напряжение U',f2(U)+' В')+T4('Ток I',f2(I)+' А')+T4('Мощность P',f2(e.P)+' Вт')+T4('Сопротивление R',R+' Ом');f=`U = I·R = ${f2(I)}·${R} = ${f2(U)} В<small>P = U·I = I²·R = ${f2(e.P)} Вт</small>`}
t.innerHTML=h;$('#pf').innerHTML=f}
function ui(){const bats=els.filter(e=>e.t==='bat'),b=bats[0];let rd='добавьте батарею',h='';
if(sel){const e=sel,I=Math.abs(e.I),U=Math.abs(e.dv),t=$('#tiles');if(t){
tilesFor(e,t)}}
if(b){const Id=-b.I,Ut=b.dv,Rx=Id>1e-6?Ut/Id:Infinity,pt=els.reduce((s,e)=>s+e.P,0)||1,pb=bats.reduce((s,e)=>s+e.P,0),pw=els.filter(e=>e.t==='wire'||SW(e.t)).reduce((s,e)=>s+e.P,0),po=pt-pb-pw;
const st=Id<1e-3?'open':(Rx<1&&Id>1)?'short':'ok',hot=els.filter(e=>e.h>1||e.br>2.5);rd='I = '+f2(Id)+' А';
const vd={open:['warn',els.some(e=>e.t==='cap'&&Math.abs(e.vc)>.05)?'Конденсатор зарядился — постоянный ток через него не идёт. Так и должно быть: ток течёт, только пока идёт зарядка.':'Цепь разомкнута — тока нет. Замкните ключ или соедините провода.'],short:['no','⚠ Короткое замыкание! '+(detail?'':'Плюс соединён с минусом почти без сопротивления: ток огромный, вся энергия уходит в тепло.')],ok:['ok','Цепь замкнута — по ней течёт ток.']}[st];
h+=`<div class="verdict ${vd[0]}">${vd[1]}</div>`;
if(detail&&st!=='open')h+=`<b class="t">Закон Ома для полной цепи</b><span class="fm">I = E/(R+r) = ${b.v}/(${f2(Rx)}+${b.r}) = ${f2(Id)} А<small>R — сопротивление внешней цепи</small></span><span class="fm">U = E − I·r = ${f2(Ut)} В<small>напряжение на клеммах батареи</small></span><span class="fm">P = I²·R = ${f2(Id*Id*Rx)} Вт<small>во внешней цепи; Q = I²·R·t</small></span>`;
if(st==='short'){h+=`<b class="t">Где выделяется тепло?</b>`+[['Батарея (r)',pb,'#ffb86b'],['Провода',pw,'#ff7a5a'],['Нагрузка',po,'#8edcff']].map(([n,p,col])=>`<div class="grow"><span class="gl">${n}</span><span class="bar2"><i style="width:${p/pt*100}%;background:${col}"></i></span><b>${Math.round(p/pt*100)}%</b></div>`).join('')+
`<div class="note" style="margin-top:6px">${detail?`R≈${f2(Rx)} Ом ≪ r, поэтому I = E/(R+r) ≈ ${f2(Id)} А. Мощность тепла P = I²·R растёт как квадрат тока и выделяется там, где сопротивление есть: больше всего — внутри батареи (r = ${b.r} Ом), и немного во всех проводах.`:'Греется там, где ток встречает сопротивление: сильнее всего — внутри самой батареи, и чуть-чуть в проводах.'}</div>`}
const dead=els.filter(e=>e.dead);if(dead.length)h+=`<div class="verdict no">💥 Вышел из строя: ${[...new Set(dead.map(e=>D[e.t].n))].join(', ')}. Замените в панели элемента.</div>`;if(hot.length&&st!=='short')h+=`<div class="verdict warn">🔥 Перегрев: ${[...new Set(hot.map(e=>D[e.t].n))].join(', ')}</div>`}
else h+=`<div class="verdict warn">Поставьте батарею («＋ Элементы» снизу) или выберите готовый пример сверху.</div>`;
h+=`<div class="lg"><i style="background:${electrons?'#7fd3ff':'#ffd27a'}"></i>${electrons?'Электроны движутся от «−» к «+»':'Условный ток: от «+» к «−»'}</div><div class="note" style="margin-top:6px">Двигать поле — тяните мышью, масштаб — колесо или щипок. Провод — кнопка «Провод» или тяните от конца провода. Элементы — «＋ Элементы»; Esc — отмена, R — повернуть выбранный (Shift+R — обратно), Ctrl+C / Ctrl+V — копировать / вставить в место под курсором, Ctrl+D — дубликат, Delete — удалить.</div>`;
$('#hud').innerHTML='<b class="t">Анализ цепи</b>'+h;$('#readout').textContent='⚡ '+rd}
let fr=0,ts=1,st=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.max(.001,Math.min(.05,(t-last)/1000||.016));last=t;T=t/1000;const dd=dirty;dirty=false;
if(dd||hasDyn()){const sd=dt*ts;solve(sd,dt);st+=sd;fr++;if(fr%2==0)els.forEach(e=>{if(e.t==='cap'||e.t==='ind'){(e.hist=e.hist||[]).push([st,e.dv,e.I]);if(e.hist.length>300)e.hist.shift()}});if(dd||fr%6==0)ui()}draw();graph()}
cv.style.cursor='grab';addEventListener('resize',resize);resize();load('simple');requestAnimationFrame(loop);
})();
