<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Живая клетка — биология</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0912;--s1:#1d1a24;--s2:#272330;--s3:#322d3d;--on:#e8e0ee;--on2:#cbc3d4;--ol:#4b4556;--pr:#d0bcff;--acc:#ffb0c8;--ok:#9be3a8;--er:#ffb4ab;box-sizing:border-box}
*{box-sizing:border-box;margin:0}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--on);font:400 14px/1.45 "Roboto Flex",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}button,input{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.glass{background:rgba(29,26,36,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#top{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:9px 12px 9px 18px;border-radius:28px;z-index:5}
#top h1{font:900 19px/1 "Roboto Flex";letter-spacing:-.4px;flex:1;white-space:nowrap;background:linear-gradient(90deg,#ffe29a,#ffb0c8,var(--pr));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{padding:8px 13px;border-radius:16px;background:var(--s2);font-weight:500;white-space:nowrap}#score{color:#ffe29a;transition:.3s}#score.pop{transform:scale(1.2);background:#5b4a14}
#nav{position:fixed;left:12px;right:12px;top:calc(72px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:4}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 15px 0 11px;border-radius:10px;border:1px solid var(--ol);background:rgba(29,26,36,.75);white-space:nowrap;font-weight:500;transition:.2s}.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}.chip.on{background:var(--c);color:#14101c;border-color:transparent}
#dock,#ddock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:30px;z-index:5;max-width:calc(100% - 16px);flex-wrap:wrap;justify-content:center}
.tg{height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--ol);font-weight:500;white-space:nowrap}.tg.on{background:#4a4458;color:#eaddff;border-color:transparent}.tg.primary{background:var(--pr);color:#27154d;border-color:transparent;font-weight:700}
.seg{display:flex;border:1px solid var(--ol);border-radius:14px;overflow:hidden}.seg button{height:38px;padding:0 12px;font-weight:500;border-right:1px solid var(--ol)}.seg button:last-child{border:0}.seg .on{background:#4a4458;color:#eaddff}
.sl{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--ol)}.sl input{width:100px;accent-color:var(--pr)}
#hint{position:fixed;left:14px;top:calc(120px + env(safe-area-inset-top,0px));z-index:3;padding:13px 15px;border-radius:18px;width:310px;max-height:calc(100% - 330px);overflow:hidden;color:var(--on2);font-size:12.5px;pointer-events:none}
#status{position:fixed;left:14px;z-index:3;padding:10px 14px;border-radius:14px;color:var(--on2);font-size:12px;max-width:min(430px,calc(100% - 28px));pointer-events:none}
#panel{position:fixed;z-index:6;background:var(--s1);border-radius:28px;overflow:auto;right:12px;top:120px;bottom:12px;width:360px;transform:translateX(120%);padding:20px;transition:transform .45s cubic-bezier(.2,0,0,1);box-shadow:0 20px 60px #000a}
body.po #panel{transform:none}#panel:before{content:"";position:absolute;inset:0 0 auto;height:170px;background:radial-gradient(circle at 20% 0,var(--pc,#d0bcff),transparent 70%);opacity:.22;pointer-events:none}
.x{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;background:var(--s2);z-index:2}
.hero{display:flex;gap:14px;align-items:center;position:relative;padding-right:35px}.orb{width:62px;height:62px;flex:none;border-radius:50%;box-shadow:0 0 30px var(--pc),inset -12px -10px 20px #000a;background:radial-gradient(circle at 32% 30%,#fff9,var(--pc) 40%,#000 135%)}
.kind{color:var(--pc);font-weight:700}h2{font:900 27px/1.05 "Roboto Flex";letter-spacing:-.7px}
.fact{margin:16px 0;padding:13px 15px;border-radius:20px 20px 20px 6px;background:var(--s2);color:var(--on2);position:relative}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{padding:10px 13px;border-radius:15px;background:var(--s2)}.tile small{display:block;color:var(--on2);font-size:12px}.tile b{font-weight:500}
.sec{margin-top:16px;position:relative}.sec h3{font-size:15px;margin-bottom:7px}.note{font-size:13px;color:var(--on2);line-height:1.55}
.formula{margin-top:8px;padding:11px 14px;border-radius:14px;background:#14101c;border:1px solid var(--ol);font:500 14px/1.5 ui-monospace,Menlo,monospace;color:#ffe29a}
.btn{width:100%;height:44px;border-radius:24px;background:var(--pr);color:#171020;font-weight:700;margin-top:10px}.btn.sec2{background:var(--s3);color:var(--on)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}td,th{padding:6px 5px;border-bottom:1px solid var(--ol);text-align:left}th{color:var(--on2);font-weight:500}
#toast{position:fixed;left:50%;top:calc(130px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;z-index:9;padding:11px 18px;border-radius:16px;background:var(--s3);box-shadow:0 8px 30px #000a;pointer-events:none;transition:.3s;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.evh{font-weight:700;color:var(--on);font-size:14px;margin-bottom:7px}.evt{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.07);border-left:3px solid var(--acc);color:var(--on)}.evt b{display:block;margin-bottom:2px}.evt.fl{animation:fl .9s}@keyframes fl{from{background:rgba(255,224,130,.38)}to{background:rgba(255,255,255,.07)}}.nw{margin-top:8px;color:var(--on2)}.nw b{color:var(--on)}#hint .formula{font-size:11.5px;padding:8px 10px}#dph button{padding:0 9px;font-size:13px}
@media(max-width:760px){#panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;height:52vh;transform:translateY(120%)}body.po #panel{transform:none}#hint{display:none}.lb{display:none}.chip{height:34px}}
</style></head>
<body>
<canvas id="scene" aria-label="Интерактивная клетка"></canvas>
<header id="top" class="glass"><h1>Живая клетка</h1><span class="pill" id="readout">—</span><span class="pill">⭐ <span id="score">0</span></span></header>
<nav id="nav"><button class="chip on" data-t="animal" style="--c:#ffb0c8"><i></i>Животная клетка</button><button class="chip" data-t="plant" style="--c:#9be3a8"><i></i>Растительная клетка</button></nav>
<div id="hint" class="glass"><div class="evh">Что происходит</div><div id="ev" class="evt"></div><div id="now"></div></div>
<div id="status" class="glass"></div>
<aside id="panel"></aside>
<div id="dock" class="glass">
<div class="seg" id="env"><button data-v="1">💧 Пресная вода</button><button class="on" data-v="0">⚖ Изотоник</button><button data-v="-1">🧂 Солёный р-р</button></div>
<label class="sl"><span id="lvn">Активность</span><input type="range" id="lv" min="0" max="100" value="60"></label>
<button class="tg" id="game">🎯 Игра</button><button class="tg" id="lab">🧪 Опыт</button><button class="tg primary" id="divb">🧬 Деление</button><button class="tg on" id="labels">Подписи</button><button class="tg" id="level">Режим: кратко</button><button class="tg" id="reset">↺</button>
</div>
<div id="ddock" class="glass" style="display:none"><button class="tg" id="dback">← К клетке</button>
<div class="seg" id="dph"><button data-i="0">Интерфаза</button><button data-i="1">Профаза</button><button data-i="2">Метафаза</button><button data-i="3">Анафаза</button><button data-i="4">Телофаза</button></div>
<button class="tg primary" id="dplay">▶ Пуск</button><input type="range" id="dp" min="0" max="1000" value="0" style="width:140px;accent-color:var(--pr)">
<div class="seg" id="dsp"><button data-v=".5">0,5×</button><button class="on" data-v="1">1×</button><button data-v="2">2×</button></div>
<button class="tg" id="dlevel">Режим: кратко</button><button class="tg on" id="dlabels">Подписи</button></div>
<div id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),cv=$('#scene'),ctx=cv.getContext('2d');
let W,H,D,type='animal',detail=false,labels=true,sel=null,hover=null,s=0,sT=0,lv=60,game=null,score=0,t=0,drag=null,items=[],rib=[],P=[],water=[],journal=[],acc={a:0,g:0,o:0};
const rnd=(()=>{let a=7;return()=>{a=(a*16807)%2147483647;return a/2147483647}})();
const I={
nuc:{n:'Ядро',k:'Органоид · есть у всех эукариот',c:'#a58bff',sz:'5–10 мкм',wh:'Животные и растения',f:'В ядре одной клетки человека ~2 м ДНК, упакованной в 46 хромосом!',d:'«Командный центр»: хранит наследственную информацию (ДНК) и управляет работой клетки. Ядро окружено оболочкой с порами, внутри — ядрышко, где собираются рибосомы.',m:'Поток информации: ДНК → РНК → белок.\nТранскрипция: ДНК → мРНК (в ядре)\nТрансляция: мРНК → белок (на рибосоме)'},
mito:{n:'Митохондрия',k:'Органоид · «электростанция»',c:'#ff9d5c',sz:'1–10 мкм',wh:'Животные и растения',f:'У митохондрий есть собственная ДНК — когда-то это были свободные бактерии.',d:'Здесь клетка «сжигает» питательные вещества с кислородом и запасает энергию в молекулах АТФ — универсальной энергетической «валюте». Двойная мембрана, внутренняя складчатая (кристы).',m:'Клеточное дыхание:\nC₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + ≈30 АТФ\nКристы увеличивают площадь, где работает АТФ-синтаза.'},
chlo:{n:'Хлоропласт',k:'Пластида · только у растений',c:'#6ed17f',sz:'4–10 мкм',wh:'Только растения и водоросли',f:'Зелёный цвет листьев — это хлорофилл внутри хлоропластов.',d:'Здесь идёт фотосинтез: из света, воды и углекислого газа получаются сахар и кислород. Стопки дисков-тилакоидов называют гранами. Подвигай ползунок «Свет» — и увидишь, как меняется работа.',m:'Фотосинтез:\n6CO₂ + 6H₂O + свет → C₆H₁₂O₆ + 6O₂\nСветовая фаза — в тилакоидах (АТФ, O₂), тёмная — в строме (сахар).'},
er:{n:'ЭПС',k:'Органоид · транспортная сеть',c:'#f48fb1',sz:'мембранные каналы',wh:'Животные и растения',f:'Мембраны ЭПС могут составлять больше половины всех мембран клетки.',d:'Эндоплазматическая сеть — система трубочек и цистерн. Шероховатая (с рибосомами) делает белки, гладкая — жиры и углеводы, а ещё обезвреживает яды.',m:'Шероховатая ЭПС → белки на экспорт.\nГладкая ЭПС → липиды, стероиды, запас Ca²⁺.'},
golgi:{n:'Аппарат Гольджи',k:'Органоид · «почта клетки»',c:'#ffd54f',sz:'1–3 мкм',wh:'Животные и растения',f:'Назван в честь итальянца Камилло Гольджи (1898 г.).',d:'Стопка уплощённых мешочков. Принимает белки из ЭПС, дорабатывает, «упаковывает» в пузырьки (везикулы) и отправляет: наружу, в лизосомы или к мембране.',m:'Везикулы идут: ЭПС → Гольджи → мембрана.\nЭкзоцитоз — выброс содержимого наружу.'},
ribo:{n:'Рибосомы',k:'Органоид без мембраны',c:'#ff8a80',sz:'20–30 нм',wh:'Все клетки',f:'В клетке их тысячи–миллионы, и они есть даже у бактерий.',d:'Крошечные «3D-принтеры белка»: читают мРНК и по ней собирают цепочку аминокислот. Бывают свободные и прикреплённые к ЭПС.',m:'Скорость: ≈ 20 аминокислот в секунду у эукариот.\nСостав: рРНК + белки (большая и малая субъединицы).'},
lyso:{n:'Лизосома',k:'Органоид · «пищеварение»',c:'#ff7a7a',sz:'0,2–0,8 мкм',wh:'Чаще у животных',f:'Внутри лизосомы кислая среда — примерно как в желудке (pH ≈ 4,5–5).',d:'Пузырёк с ферментами: переваривает пищу, старые органоиды и бактерий. У растений похожую роль часто играет вакуоль.',m:'Кислые гидролазы работают при pH ≈ 5.\nАутофагия — «уборка» клетки от изношенных частей.'},
cent:{n:'Центриоли',k:'Органоид · «разметчик деления»',c:'#9be3a8',sz:'≈ 0,2 × 0,5 мкм',wh:'Животные (у высших растений нет)',f:'Две центриоли стоят под прямым углом друг к другу.',d:'Два цилиндра из микротрубочек, стоящие под прямым углом (на рисунке один виден сбоку, другой — торцом: на нём видны 9 триплетов). При делении клетки строят «веретено», которое растаскивает хромосомы. Загляни в режим «Деление»!',m:'Устройство: 9 триплетов микротрубочек («9×3»).\nВ делении: центросома удваивается → два полюса веретена.'},
vac:{n:'Вакуоль',k:'Органоид · «водохранилище»',c:'#8ec9ff',sz:'до 90% объёма клетки',wh:'Особенно растения',f:'Вакуоль держит форму травинки: без воды растение вянет.',d:'Большой мешок с клеточным соком: вода, сахара, соли, пигменты. Давит на стенку изнутри — это тургор. Попробуй «Солёный р-р»: вода уйдёт и вакуоль съёжится.',m:'Тургорное давление не даёт стеблю обвиснуть.\nПлазмолиз: протопласт отходит от стенки в гипертоническом растворе.'},
wall:{n:'Клеточная стенка',k:'Оболочка · только у растений',c:'#7fcf8e',sz:'0,1–10 мкм',wh:'Растения, грибы, бактерии',f:'Целлюлоза — самое распространённое органическое вещество на Земле.',d:'Прочный каркас из целлюлозы снаружи мембраны. Защищает и задаёт форму. Она пропускает воду и растворы — это не «барьер», а «сито».',m:'Целлюлоза — полимер глюкозы (C₆H₁₀O₅)ₙ.\nБлагодаря стенке растительная клетка не лопается в пресной воде.'},
mem:{n:'Мембрана',k:'Оболочка · граница клетки',c:'#f2b8d0',sz:'7–10 нм',wh:'Все клетки',f:'Толщина мембраны — в 10 000 раз меньше толщины листа бумаги.',d:'Двойной слой липидов с белками. Полупроницаемая: одно пропускает, другое нет. Регулирует, что входит и выходит. Через неё идёт осмос.',m:'Жидкостно-мозаичная модель (Сингер, Николсон, 1972).\nОсмос: вода идёт туда, где больше растворённых веществ.\nπ = i·C·R·T (закон Вант-Гоффа)'},
cyto:{n:'Цитоплазма',k:'Среда · внутри клетки',c:'#b8a9ff',sz:'≈ 80% — вода',wh:'Все клетки',f:'В цитоплазме идёт постоянное движение — циклоз, он разносит вещества.',d:'Желеобразная жидкость (гиалоплазма), в которой «плавают» органоиды. В ней идут многие химические реакции, например гликолиз.',m:'Гликолиз: C₆H₁₂O₆ → 2 пируват + 2 АТФ\n(без кислорода, в цитоплазме).'}};
const col={nuc:1};
function build(){P=[];rib=[];journal=journal;
 const mk=(id,x,y,r,o)=>items.push(Object.assign({id,x,y,r,ax:.07,ay:.05,sp:.3+rnd()*.3,ph:rnd()*6,rot:rnd()*3},o||{}));items=[];
 if(type==='animal'){
  mk('nuc',-.25,-.05,.42,{ax:0,ay:0});mk('er',.45,-.05,.28,{ax:0,ay:0});mk('golgi',.98,-.02,.2,{ax:0,ay:0});
  [[.55,.5],[-.85,.4],[.75,-.5],[-.75,-.55],[.05,.68]].forEach(p=>mk('mito',p[0],p[1],.17));
  [[-1,-.05],[.95,.55],[-.45,.65]].forEach(p=>mk('lyso',p[0],p[1],.1));mk('cent',-.62,-.62,.15,{ax:.06,ay:.05});
 }else{
  mk('vac',.3,.05,.62,{ax:0,ay:0});mk('nuc',-.92,-.42,.28,{ax:0,ay:0});mk('er',-.52,-.2,.24,{ax:0,ay:0});mk('golgi',-.55,.4,.16,{ax:0,ay:0});
  [[-.95,.55],[-.35,.8],[.4,.8],[1.05,.62],[-.2,-.8],[.55,-.8],[1.1,-.4]].forEach(p=>mk('chlo',p[0],p[1],.16,{ax:.05,ay:.03}));
  [[-.8,.05],[.9,-.78],[-.02,-.55]].forEach(p=>mk('mito',p[0],p[1],.13));
 }
 for(let i=0;i<90&&rib.length<60;i++){const x=(rnd()*2-1)*(type==='animal'?1.2:1.2),y=(rnd()*2-1)*.85;
  if(type==='animal'?((x/1.4)**2+y*y>.7):false)continue;
  if(items.some(o=>Math.hypot(x-o.x,y-o.y)<o.r*(o.id==='vac'?1.0:1.3)))continue;rib.push({x,y})}
}
function geo(){const u=Math.min(W*(W<760?.3:.26),H*.33),pw=document.body.classList.contains('po')&&W>760?190:0;
 const hx=u*(type==='animal'?1.4:1.38),hy=u*(type==='animal'?1:1);return{u,hx,hy,cx:W/2-pw,cy:H*.5+(W<760?-10:10)}}
const kkF=(v=s)=>type==='animal'?1+.1*v-(v<-.15?.1*(-v-.15):0):(v<0?1+.3*v:1);
function rel(o){return o.ax||o.ay?{x:o.x+o.ax*Math.cos(t*o.sp+o.ph),y:o.y+o.ay*Math.sin(t*o.sp*1.3+o.ph)}:{x:o.x,y:o.y}}
function pos(o){const g=geo(),B=kkF(),p=rel(o);return{x:g.cx+p.x*g.u*B,y:g.cy+p.y*g.u*B}}
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);const d=div.on?$('#ddock'):$('#dock');$('#status').style.bottom=(d.offsetHeight+26)+'px'}
function hit(mx,my){const g=geo(),B=kkF();
 for(let i=items.length-1;i>=0;i--){const o=items[i],p=pos(o);
  if(o.id==='vac'){const vs=s<0?1+.5*s:1+.1*s;if(((mx-(g.cx+o.x*g.u*B))/(.7*g.u*vs*B))**2+((my-(g.cy+o.y*g.u*B))/(.5*g.u*vs*B))**2<1)return o}
  else if(Math.hypot(mx-p.x,my-p.y)<=Math.max(o.r*g.u*B,14))return o}
 for(const r of rib){if(Math.hypot(mx-(g.cx+r.x*g.u*B),my-(g.cy+r.y*g.u*B))<9)return{id:'ribo'}}
 const dx=mx-g.cx,dy=my-g.cy;
 if(type==='plant'){const nw=Math.max(Math.abs(dx)/g.hx,Math.abs(dy)/g.hy),np=Math.max(Math.abs(dx)/(g.hx*B),Math.abs(dy)/(g.hy*B));

  if(!drag.moved&&Math.hypot(dx,dy)>6&&drag.o&&drag.o.x!==undefined&&drag.o.id!=='vac')drag.moved=true;
  if(drag.moved){const g=geo(),B=kkF(),o=drag.o;let nx=(p.x-g.cx)/(g.u*B),ny=(p.y-g.cy)/(g.u*B);const lim=type==='animal'?.88:1;if(type==='animal'&&(nx/1.4)**2+ny**2>.72){const k=Math.sqrt((nx/1.4)**2+ny**2)/.85;nx/=k;ny/=k}nx=Math.max(-1.2,Math.min(1.2,nx));ny=Math.max(-.85,Math.min(.85,ny));o.x=nx;o.y=ny;o.ax=o.ay=0}return}
 const o=hit(p.x,p.y);hover=o&&o.x!==undefined?o:null;cv.style.cursor=o?'pointer':'default'});

 const id=d.o.id;
 if(game){if(id===game.t){game.s++;addScore(10+Math.min(game.s,5)*2);say('✅ Верно! '+I[id].f);nextQ()}else{game.s=0;say('❌ Это «'+nm(id)+'». Ищем: '+nm(game.t));status()}}
 else{openInfo(id);setEv('Выбрано: '+nm(id),'Подробности — в карточке справа. Попробуй перетащить этот органоид.')}});
